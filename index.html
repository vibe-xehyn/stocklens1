<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 투자 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3248;
    --text: #e2e8f0;
    --muted: #8892a4;
    --accent: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --purple: #a855f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', -apple-system, sans-serif; min-height: 100vh; }

  /* Header */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text); }
  .market-bar { display: flex; gap: 24px; font-size: 13px; }
  .market-item { display: flex; flex-direction: column; align-items: center; }
  .market-name { color: var(--muted); font-size: 11px; }
  .market-val { font-weight: 600; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .flat { color: var(--muted); }
  .header-time { font-size: 12px; color: var(--muted); }

  /* Layout */
  .container { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 60px); }

  /* Sidebar */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    overflow-y: auto;
    height: calc(100vh - 60px);
    position: sticky;
    top: 60px;
  }
  .sidebar-search {
    margin: 0 12px 12px;
    position: relative;
  }
  .sidebar-search input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px 8px 32px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .sidebar-search input:focus { border-color: var(--accent); }
  .sidebar-search .icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 14px; }
  .market-tabs {
    display: flex;
    margin: 0 12px 12px;
    gap: 4px;
  }
  .market-tab {
    flex: 1;
    padding: 6px;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .market-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .section-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 8px 16px 4px;
  }
  .stock-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    cursor: pointer;
    transition: background 0.15s;
    border-left: 3px solid transparent;
  }
  .stock-item:hover { background: var(--surface2); }
  .stock-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .stock-left .ticker { font-size: 13px; font-weight: 700; }
  .stock-left .name { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .stock-right { text-align: right; }
  .stock-price { font-size: 13px; font-weight: 600; }
  .stock-change { font-size: 11px; margin-top: 1px; }

  /* Main */
  main { padding: 24px; overflow-y: auto; }

  /* Stock Header */
  .stock-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
  }
  .stock-title h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
  .stock-title .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .stock-title .badge {
    display: inline-block;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    margin-right: 6px;
    margin-top: 6px;
    font-weight: 600;
  }
  .badge-kr { background: #1e3a5f; color: #60a5fa; }
  .badge-us { background: #1a3a2a; color: #4ade80; }
  .badge-kospi { background: #1e3a5f; color: #60a5fa; }
  .badge-kosdaq { background: #2d1f5e; color: #c084fc; }
  .badge-nasdaq { background: #1a3a2a; color: #4ade80; }
  .badge-nyse { background: #1f3a2a; color: #34d399; }
  .price-block { text-align: right; }
  .current-price { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .price-change { font-size: 16px; font-weight: 600; margin-top: 4px; }

  /* Grid cards */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .card-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  .card-value { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .indicator-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .indicator-fill { height: 100%; border-radius: 2px; }

  /* Two-col layout */
  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }

  /* Chart */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .chart-title { font-size: 15px; font-weight: 700; }
  .chart-tabs { display: flex; gap: 4px; }
  .chart-tab {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    transition: all 0.2s;
  }
  .chart-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  canvas { width: 100% !important; }

  /* Indicators table */
  .indicators-table { width: 100%; border-collapse: collapse; }
  .indicators-table th {
    font-size: 11px;
    color: var(--muted);
    text-align: left;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .indicators-table td {
    padding: 10px 0;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
  }
  .indicators-table tr:last-child td { border-bottom: none; }
  .ind-name { color: var(--muted); }
  .ind-val { font-weight: 600; text-align: right; }
  .ind-grade { text-align: right; font-size: 11px; font-weight: 700; }
  .grade-good { color: var(--green); }
  .grade-neutral { color: var(--yellow); }
  .grade-bad { color: var(--red); }

  /* News */
  .news-item {
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover .news-title { color: var(--accent); }
  .news-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .news-source { font-size: 11px; font-weight: 700; color: var(--accent); }
  .news-time { font-size: 11px; color: var(--muted); }
  .news-sentiment {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: auto;
  }
  .sent-pos { background: rgba(34,197,94,0.15); color: var(--green); }
  .sent-neg { background: rgba(239,68,68,0.15); color: var(--red); }
  .sent-neu { background: rgba(100,116,139,0.15); color: var(--muted); }
  .news-title { font-size: 13px; font-weight: 600; line-height: 1.4; transition: color 0.15s; }
  .news-summary { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  /* Financials */
  .fin-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .fin-row:last-child { border-bottom: none; }
  .fin-label { color: var(--muted); }
  .fin-val { font-weight: 600; }

  /* Score ring */
  .score-section { display: flex; align-items: center; gap: 20px; }
  .score-ring { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-number { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; font-weight: 800; }
  .score-details { flex: 1; }
  .score-bar-item { margin-bottom: 8px; }
  .score-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .score-bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); transition: width 0.5s; }

  /* Watchlist highlight */
  .watchlist-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }
  .watchlist-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .watchlist-btn.watching { background: rgba(245,158,11,0.1); border-color: var(--yellow); color: var(--yellow); }

  /* Responsive */
  @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    aside { display: none; }
    .two-col, .three-col { grid-template-columns: 1fr; }
  }
</style>
</head>

function generateChart(basePrice, days, market) {
  const labels = [];
  const data = [];
  const now = new Date();
  let price = basePrice * 0.88;
  for (let i = days; i >= 0; i--) {
    const d = new Date(now);
    d.setDate(d.getDate() - i);
    if (market === 'kr') {
      labels.push(d.toLocaleDateString('ko', { month: 'short', day: 'numeric' }));
    } else {
      labels.push(d.toLocaleDateString('en', { month: 'short', day: 'numeric' }));
    }
    price *= (1 + (Math.random() - 0.46) * 0.025);
    data.push(parseFloat(price.toFixed(market === 'kr' ? 0 : 2)));
  }
  data[data.length - 1] = basePrice;
  return { labels, data };
}

function fmt(n) { return n >= 0 ? `+${n}` : `${n}`; }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(2) + '%'; }
function scoreColor(s) {
  if (s >= 75) return '#22c55e';
  if (s >= 55) return '#f59e0b';
  return '#ef4444';
}
function gradeClass(val, metric) {
  const thresholds = {
    per: { good: 15, ok: 25 },
    pbr: { good: 1.5, ok: 3 },
    roe: { good: 15, ok: 10, invert: true },
    div: { good: 3, ok: 1, invert: true },
    operatingMargin: { good: 20, ok: 10, invert: true },
    debtRatio: { good: 40, ok: 80 },
  };
  const t = thresholds[metric];
  if (!t) return '';
  if (t.invert) {
    if (val >= t.good) return 'grade-good';
    if (val >= t.ok) return 'grade-neutral';
    return 'grade-bad';
  } else {
    if (val <= t.good) return 'grade-good';
    if (val <= t.ok) return 'grade-neutral';
    return 'grade-bad';
  }
}
function gradeLabel(cls) {
  if (cls === 'grade-good') return '우수';
  if (cls === 'grade-neutral') return '보통';
  return '주의';
}

// ── SIDEBAR ──────────────────────────────────────────────────────────────────────

function renderSidebar(filter = '') {
  const list = document.getElementById('stockList');
  const markets = currentMarket === 'all' ? ['kr', 'us'] : [currentMarket];
  const labels = { kr: '한국 주식', us: '미국 주식' };

  let html = '';
  markets.forEach(m => {
    const items = STOCKS.filter(s =>
      s.market === m &&
      (s.name.toLowerCase().includes(filter.toLowerCase()) ||
       s.ticker.toLowerCase().includes(filter.toLowerCase()))
    );
    if (!items.length) return;
    html += `<div class="section-label">${labels[m]}</div>`;
    items.forEach(s => {
      const up = s.changePct >= 0;
      html += `
        <div class="stock-item ${s.id === currentStock.id ? 'active' : ''}" onclick="selectStock('${s.id}')">
          <div class="stock-left">
            <div class="ticker">${s.ticker}</div>
            <div class="name">${s.name}</div>
          </div>
          <div class="stock-right">
            <div class="stock-price ${up ? 'up' : 'down'}">${s.currency}${s.price.toLocaleString()}</div>
            <div class="stock-change ${up ? 'up' : 'down'}">${fmtPct(s.changePct)}</div>
          </div>
        </div>`;
    });
  });
  list.innerHTML = html;
}

function switchMarket(m, btn) {
  currentMarket = m;
  document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar();
}

function filterStocks() {
  renderSidebar(document.getElementById('searchInput').value);
}

function selectStock(id) {
  currentStock = STOCKS.find(s => s.id === id);
  renderSidebar(document.getElementById('searchInput').value);
  renderMain();
}

function metricCard(label, val, sub, cls, raw, min, max) {
  const pct = Math.min(100, Math.max(0, ((raw - min) / (max - min)) * 100));
  const color = cls === 'grade-good' ? 'var(--green)' : cls === 'grade-neutral' ? 'var(--yellow)' : 'var(--red)';
  return `
    <div class="card">
      <div class="card-label">${label}</div>
      <div class="card-value" style="color:${cls ? color : 'var(--text)'}">${val}</div>
      <div class="card-sub">${sub}</div>
      <div class="indicator-bar"><div class="indicator-fill" style="width:${pct}%;background:${color}"></div></div>
    </div>`;
}

function indicatorRow(name, val, metric, raw) {
  const cls = metric ? gradeClass(raw, metric) : '';
  return `
    <tr>
      <td class="ind-name">${name}</td>
      <td></td>
      <td class="ind-val">${val}</td>
      <td class="ind-grade ${cls}">${cls ? gradeLabel(cls) : '-'}</td>
    </tr>`;
}

// ── CHART ──────────────────────────────────────────────────────────────────────

function drawChart(s, period) {
  let { labels, data } = s.chartData;
  const n = period === '1W' ? 7 : period === '1M' ? 30 : 90;
  // For 3M generate more data from base
  let displayLabels = labels.slice(-Math.min(n, labels.length));
  let displayData = data.slice(-Math.min(n, data.length));

  if (period === '3M') {
    const extra = generateChart(s.price, 90, s.market);
    displayLabels = extra.labels;
    displayData = extra.data;
  }

  const up = displayData[displayData.length - 1] >= displayData[0];
  const color = up ? '#22c55e' : '#ef4444';

  if (priceChart) priceChart.destroy();
  const ctx = document.getElementById('priceChart').getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 300);
  gradient.addColorStop(0, up ? 'rgba(34,197,94,0.25)' : 'rgba(239,68,68,0.25)');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');

  priceChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: displayLabels,
      datasets: [{
        data: displayData,
        borderColor: color,
        borderWidth: 2,
        backgroundColor: gradient,
        fill: true,
        tension: 0.3,
        pointRadius: 0,
        pointHoverRadius: 4,
      }]
    },
    options: {
      responsive: true,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: 'rgba(26,29,39,0.95)',
          borderColor: '#2e3248',
          borderWidth: 1,
          titleColor: '#8892a4',
          bodyColor: '#e2e8f0',
          callbacks: {
            label: ctx => ` ${s.currency}${ctx.parsed.y.toLocaleString()}`,
          }
        }
      },
      scales: {
        x: {
          grid: { color: 'rgba(46,50,72,0.5)' },
          ticks: { color: '#8892a4', maxTicksLimit: 6, font: { size: 11 } },
        },
        y: {
          grid: { color: 'rgba(46,50,72,0.5)' },
          ticks: { color: '#8892a4', font: { size: 11 }, callback: v => s.currency + v.toLocaleString() },
          position: 'right',
        }
      }
    }
  });
}

function changeChartPeriod(period, btn) {
  currentChartPeriod = period;
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  drawChart(currentStock, period);
}

// ── WATCHLIST ──────────────────────────────────────────────────────────────────

function toggleWatch(id, btn) {
  if (watchlist.has(id)) {
    watchlist.delete(id);
    btn.textContent = '☆ 관심종목 추가';
    btn.classList.remove('watching');
  } else {
    watchlist.add(id);
    btn.textContent = '★ 관심종목';
    btn.classList.add('watching');
  }
}

// ── INIT ──────────────────────────────────────────────────────────────────────

renderHeader();
renderSidebar();
renderMain();
</script>
</body>
</html>
