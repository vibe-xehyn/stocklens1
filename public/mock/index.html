<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockLens 모의투자 (Mock Trading Platform)</title>
  
  <!-- Pretendard & Noto Sans KR Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <!-- Lightweight Charts Standalone Library -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  
  <!-- App Stylesheet -->
  <link rel="stylesheet" href="style.css?v=20260719_v3">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" class="logo-group">
        <span class="logo-text">Stock<span>Lens</span></span>
        <span class="badge-mock">모의투자</span>
      </a>

      <!-- Account Switcher Dropdown Toggle -->
      <div class="account-selector-wrapper">
        <button class="account-selector-btn" onclick="toggleAccountDropdown()">
          <span id="activeAccountTitle">계좌 정보 불러오는 중...</span>
          <span id="activeAccountBadge" class="account-mode-tag tag-realtime">실전형</span>
          <span style="font-size:10px; color:var(--muted);">▼</span>
        </button>

        <div id="accountDropdownMenu" class="dropdown-menu">
          <div style="font-size:11px; font-weight:800; color:var(--muted); padding:4px 8px 8px 8px;">내 모의투자 계좌 목록</div>
          <div id="accountDropdownList"></div>
        </div>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:16px;">
      <div style="font-size:12px; font-weight:700; color:var(--text2); background:var(--surface2); padding:6px 12px; border-radius:99px; border:1px solid var(--border);">
        💱 <span id="headerLiveRate">1$ = ₩1,380.5</span>
      </div>

      <a href="/" style="font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; display:flex; align-items:center; gap:4px;">
        메인 분석 서비스로 돌아가기 →
      </a>
    </div>
  </header>

  <!-- App Main Root (Toggles between Onboarding Setup and Primary Dashboard) -->
  <div id="appMainRoot" class="app-container">

    <!-- Hero Asset & Investment Summary Grid -->
    <div class="hero-grid">
      <!-- Total Combined Investment Amount & PnL Card -->
      <div class="card">
        <div class="hero-total-label">
          <span>주식 총 투자 금액 (미국 + 국내 합산)</span>
          <span style="font-size:11px; color:var(--accent); font-weight:700;">실시간 자동 정산</span>
        </div>
        <div class="hero-total-amount" id="totalInvestmentAmount">₩0원</div>
        <div class="hero-pnl-row flat" id="totalPnlRow">
          평가손익: ₩0원 (0.00%)
        </div>
      </div>

      <!-- KRW Cash Card -->
      <div class="card" onclick="switchNavTab('exchange')" style="cursor:pointer;">
        <div class="cash-card-header">
          <span class="cash-card-title">원화 예수금 (KRW)</span>
          <button class="exchange-link-btn">환전하기 →</button>
        </div>
        <div class="cash-card-val" id="krwCashVal">₩0원</div>
        <div style="font-size:11px; color:var(--muted); margin-top:6px;">국내주식 및 미주 자동 환전 예수금</div>
      </div>

      <!-- USD Cash Card -->
      <div class="card" onclick="switchNavTab('exchange')" style="cursor:pointer;">
        <div class="cash-card-header">
          <span class="cash-card-title">달러 예수금 (USD)</span>
          <button class="exchange-link-btn">환전하기 →</button>
        </div>
        <div class="cash-card-val" id="usdCashVal">$0.00</div>
        <div style="font-size:11px; color:var(--muted); margin-top:6px;">해외주식 직접 거래 전용 예수금</div>
      </div>
    </div>

    <!-- Navigation Bar (Main Tab Switching) -->
    <div class="nav-tabs">
      <button class="bnav-tab-item active" data-tab="base">기본 화면 (내 계좌 / 보유주식)</button>
      <button class="bnav-tab-item" data-tab="watchlist">관심 종목</button>
      <button class="bnav-tab-item" data-tab="discovery">발견 / 종목 탐색</button>
      <button class="bnav-tab-item" data-tab="feed">피드 / 실시간 토론</button>
      <button class="bnav-tab-item" data-tab="exchange">환전 / 계좌 관리</button>
    </div>

    <!-- Dynamic Main Tab Content Container -->
    <div id="mainTabContent"></div>

  </div>

  <!-- ── Currency Exchange Modal ── -->
  <div id="exchangeModal" class="modal-overlay">
    <div class="modal-card" style="max-width:440px;">
      <div class="modal-header">
        <div class="modal-title">실시간 환전 신청</div>
        <button class="modal-close-btn" onclick="closeModal('exchangeModal')">✕</button>
      </div>

      <div style="font-size:13px; color:var(--muted); margin-bottom:16px;">
        적용 환율: <strong style="color:var(--text);">1 USD = ₩1,380.50 KRW</strong>
      </div>

      <div style="margin-bottom:14px;">
        <label style="font-size:12px; font-weight:700; color:var(--text2); display:block; margin-bottom:4px;">환전 방향</label>
        <select id="modalExDir" class="select-control" style="width:100%; padding:10px;">
          <option value="KRW">원화(₩) → 달러($) 구매</option>
          <option value="USD">달러($) → 원화(₩) 환전</option>
        </select>
      </div>

      <div style="margin-bottom:20px;">
        <label style="font-size:12px; font-weight:700; color:var(--text2); display:block; margin-bottom:4px;">신청 금액</label>
        <input type="number" id="modalExAmt" class="select-control" style="width:100%; padding:10px; font-size:16px;" placeholder="금액 입력">
      </div>

      <button class="primary-action-btn" onclick="submitModalExchange()">즉시 환전 실행</button>
    </div>
  </div>

  <!-- ── Stock Detail & Order Sheet Modal ── -->
  <div id="stockDetailModal" class="modal-overlay">
    <div class="modal-card" style="max-width:680px;">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalStockTitle">종목 상세보기</div>
          <div style="display:flex; align-items:center; gap:8px; margin-top:4px;">
            <span id="modalStockPrice" style="font-size:22px; font-weight:900; color:var(--text);">₩0</span>
            <span id="modalStockChange" class="stock-change-sub flat">+0.00%</span>
          </div>
        </div>
        <div style="display:flex; align-items:center; gap:10px;">
          <button id="modalFavBtn" class="pill-btn" onclick="toggleModalWatchlist()">♡ 관심종목 추가</button>
          <button class="modal-close-btn" onclick="closeModal('stockDetailModal')">✕</button>
        </div>
      </div>

      <!-- Stock Analysis Factor Indicators -->
      <div id="modalAnalysisFactors"></div>

      <!-- Lightweight Chart Component -->
      <div id="tvChartContainer" style="width:100%; height:260px; margin-bottom:20px; border-radius:var(--radius-sm); overflow:hidden;"></div>

      <!-- 5-Level Order Book Depth -->
      <div style="font-size:14px; font-weight:800; margin-bottom:8px; color:var(--text);">실시간 5단계 호가창</div>
      <div id="modalOrderBookContainer"></div>

      <!-- Order Sheet -->
      <div style="background:var(--surface2); border-radius:var(--radius-md); padding:16px; margin-top:16px;">
        <div style="display:flex; gap:10px; margin-bottom:14px;">
          <button id="btnOrderTabBuy" class="pill-btn active" style="flex:1; padding:8px;" onclick="setOrderType('buy')">매수 (Buy)</button>
          <button id="btnOrderTabSell" class="pill-btn" style="flex:1; padding:8px;" onclick="setOrderType('sell')">매도 (Sell)</button>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <select id="orderPriceModeSelect" class="select-control" style="flex:1;" onchange="togglePriceMode(this.value)">
            <option value="market">시장가 주문</option>
            <option value="limit">지정가 주문</option>
          </select>
          <input type="number" id="orderPriceInput" class="select-control" style="flex:1; display:none;" placeholder="지정 호가 입력">
        </div>

        <div style="margin-bottom:14px;">
          <label style="font-size:12px; font-weight:700; color:var(--text2); display:block; margin-bottom:4px;">주문 수량 (주)</label>
          <input type="number" id="orderQtyInput" class="select-control" style="width:100%; padding:10px; font-size:16px;" placeholder="수량 입력" value="1">
        </div>

        <button class="primary-action-btn" onclick="submitOrderFromModal()">주문 전송하기</button>
      </div>
    </div>
  </div>

  <script>
    function submitModalExchange() {
      const dir = document.getElementById('modalExDir').value;
      const amt = parseFloat(document.getElementById('modalExAmt').value);
      if (!amt || amt <= 0) { showToast('올바른 금액을 입력하세요.'); return; }
      executeManualExchange(dir, amt);
    }

    function setOrderType(type) {
      MockState.orderType = type;
      document.getElementById('btnOrderTabBuy').classList.toggle('active', type === 'buy');
      document.getElementById('btnOrderTabSell').classList.toggle('active', type === 'sell');
    }

    function togglePriceMode(mode) {
      MockState.orderPriceMode = mode;
      document.getElementById('orderPriceInput').style.display = mode === 'limit' ? 'block' : 'none';
    }
  </script>

  <!-- App Script -->
  <script src="app.js?v=20260719_v3"></script>
</body>
</html>
