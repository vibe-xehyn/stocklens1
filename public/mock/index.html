<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockLens 모의투자 (Premium)</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css?v=premium1">
</head>
<body>

  <header class="app-header toss-header">
    <div class="header-left">
      <h1 class="header-title" style="font-size: 24px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 2px;">토스증권</h1>
      <div style="font-size: 13px; color: var(--muted); font-weight: 500;">모의투자 <span id="headerIndexStr" style="color:var(--red);">연동중</span></div>
    </div>
    <div class="header-icons">
      <button onclick="location.href='/'">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button onclick="toggleSettingsDrawer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
    </div>
  </header>

  <main class="app-content">
    
    <!-- Account Switcher Area -->
    <div class="toss-account-header">
      <div class="account-selector" onclick="toggleSettingsDrawer()">
        <div class="account-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <span class="account-name" id="currentAccountName">단기 연습계좌</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="account-view-link" onclick="toggleSettingsDrawer()">계좌 관리</div>
    </div>

    <!-- Balance Cards (원화 / 달러) -->
    <div class="toss-balance-cards">
      <div class="balance-card">
        <div class="balance-title">원화</div>
        <div class="balance-amount" id="portfolioCashKrw">33원</div>
      </div>
      <div class="balance-card">
        <div class="balance-title">달러</div>
        <div class="balance-amount" id="portfolioCashUsd">$0.00</div>
      </div>
    </div>

    <!-- Total Investment -->
    <section class="toss-portfolio-hero">
      <div class="portfolio-label">내 투자</div>
      <div style="display:flex; align-items:center; gap:4px; margin-bottom: 6px;">
        <h2 class="portfolio-total" id="portfolioTotal">1,751,748원</h2>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" style="width:20px;height:20px;margin-top:4px;"><polyline points="9 18 15 12 9 6"/></svg>
      </div>
      <div class="portfolio-return color-red" id="portfolioReturn">
        +217,339원 (14.1%)
      </div>
    </section>

    <!-- Filters -->
    <div class="toss-filters">
      <button class="toss-chip">수익률 높은 순 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></button>
      <div style="display:flex; gap:6px;">
        <button class="toss-chip toggle-chip"><span class="active">현재가</span> <span>평가금</span></button>
        <button class="toss-chip toggle-chip"><span class="active">$</span> <span>원</span></button>
      </div>
    </div>

    <!-- Tab Contents -->
    <div class="tab-content active" id="tabHoldings">
      <div class="list-container" id="holdingsList">
        <div class="empty-state">보유중인 주식이 없습니다.</div>
      </div>
    </div>

    <div class="tab-content" id="tabShopping">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="주식 검색 (예: 테슬라, 삼성전자)" autocomplete="off">
      </div>
      <div class="list-container" id="searchList">
        <div class="section-title">인기 종목</div>
        <!-- Default items will be injected here -->
      </div>
    </div>

    <div class="tab-content" id="tabHistory">
      <div class="list-container" id="historyList">
        <div class="empty-state">거래 내역이 없습니다.</div>
      </div>
    </div>

  </main>

  <!-- Bottom Sheet (Order Drawer) -->
  <div class="bottom-sheet-overlay" id="orderSheetOverlay" onclick="closeOrderSheet(event)">
    <div class="bottom-sheet" id="orderSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-stock-info">
          <img src="" id="orderStockIcon" class="stock-icon" onerror="this.style.display='none'">
          <h2 id="orderStockName">종목명</h2>
        </div>
        <div class="sheet-price-info">
          <div id="orderStockPrice" class="sheet-price">0원</div>
          <div id="orderStockChange" class="sheet-change">0.00%</div>
        </div>
      </div>
      
      <div class="sheet-body">
        <div class="order-type-tabs">
          <button class="order-type-btn active" id="btnOrderBuy" onclick="switchOrderType('buy')">구매</button>
          <button class="order-type-btn" id="btnOrderSell" onclick="switchOrderType('sell')">판매</button>
        </div>

        <div class="input-container">
          <input type="text" id="orderAmountInput" placeholder="얼마나 주문할까요?" inputmode="numeric" oninput="formatOrderInput(this)">
          <span class="input-suffix">원</span>
        </div>
        <div class="estimated-qty" id="estimatedQty">예상 수량: 0주</div>

        <div class="quick-amounts">
          <button onclick="addOrderAmount(10000)">+1만</button>
          <button onclick="addOrderAmount(50000)">+5만</button>
          <button onclick="addOrderAmount(100000)">+10만</button>
          <button onclick="addOrderAmount('max')">최대</button>
        </div>
      </div>

      <div class="sheet-footer">
        <button class="toss-btn primary" id="btnExecuteOrder" onclick="executeOrder()">주문하기</button>
      </div>
    </div>
  </div>

  <!-- Settings Drawer -->
  <div class="bottom-sheet-overlay" id="settingsSheetOverlay" onclick="closeSettingsSheet(event)">
    <div class="bottom-sheet" id="settingsSheet">
      <div class="sheet-handle"></div>
      <h3 style="margin-bottom: 24px; font-size: 20px; font-weight: 800;">설정</h3>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="toss-btn secondary" onclick="resetMockData()">초기 투자금 재설정 (₩10,000,000)</button>
        <button class="toss-btn secondary" style="color:var(--red);" onclick="clearAllData()">모든 데이터 초기화</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toss-toast" id="toastMsg">알림 메시지</div>

  <script src="app.js?v=premium1"></script>
</body>
</html>
