<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>StockLens 모의투자 (Premium)</title>
  <!-- Pretendard Font -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="style.css?v=premium1">
</head>
<body>

  <header class="app-header">
    <button class="back-btn" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <h1 class="header-title">모의투자</h1>
    <button class="settings-btn" onclick="toggleSettingsDrawer()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="app-content">
    
    <!-- Mode Toggle (Hero) -->
    <div class="mode-toggle-container">
      <div class="mode-toggle-bg"></div>
      <button class="mode-btn active" id="btnModeVirtual" onclick="switchMode('virtual')">단기 연습모드</button>
      <button class="mode-btn" id="btnModeRealtime" onclick="switchMode('realtime')">실전 롱텀모드</button>
    </div>

    <!-- Portfolio Card -->
    <section class="portfolio-hero">
      <div class="portfolio-label">총 자산</div>
      <h2 class="portfolio-total" id="portfolioTotal">₩0</h2>
      <div class="portfolio-return" id="portfolioReturn">
        <span class="return-pct">0.00%</span>
        <span class="return-amt">0원</span>
      </div>
      
      <div class="portfolio-details">
        <div class="detail-row">
          <span>투자 원금</span>
          <span id="portfolioCapital">₩0</span>
        </div>
        <div class="detail-row">
          <span>주문가능 금액</span>
          <span id="portfolioCash" style="color:var(--accent); font-weight:700;">₩0</span>
        </div>
      </div>
    </section>

    <!-- Nav Tabs -->
    <div class="toss-tabs">
      <div class="tab active" onclick="switchTab('holdings')">보유 주식</div>
      <div class="tab" onclick="switchTab('shopping')">주식 쇼핑</div>
      <div class="tab" onclick="switchTab('history')">거래 내역</div>
      <div class="tab-indicator"></div>
    </div>

    <!-- Tab Contents -->
    <div class="tab-content active" id="tabHoldings">
      <div class="list-container" id="holdingsList">
        <div class="empty-state">보유중인 주식이 없습니다.</div>
      </div>
    </div>

    <div class="tab-content" id="tabShopping">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="주식 검색 (예: 테슬라, 삼성전자)" autocomplete="off">
      </div>
      <div class="list-container" id="searchList">
        <div class="section-title">인기 종목</div>
        <!-- Default items will be injected here -->
      </div>
    </div>

    <div class="tab-content" id="tabHistory">
      <div class="list-container" id="historyList">
        <div class="empty-state">거래 내역이 없습니다.</div>
      </div>
    </div>

  </main>

  <!-- Bottom Sheet (Order Drawer) -->
  <div class="bottom-sheet-overlay" id="orderSheetOverlay" onclick="closeOrderSheet(event)">
    <div class="bottom-sheet" id="orderSheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-stock-info">
          <img src="" id="orderStockIcon" class="stock-icon" onerror="this.style.display='none'">
          <h2 id="orderStockName">종목명</h2>
        </div>
        <div class="sheet-price-info">
          <div id="orderStockPrice" class="sheet-price">0원</div>
          <div id="orderStockChange" class="sheet-change">0.00%</div>
        </div>
      </div>
      
      <div class="sheet-body">
        <div class="order-type-tabs">
          <button class="order-type-btn active" id="btnOrderBuy" onclick="switchOrderType('buy')">구매</button>
          <button class="order-type-btn" id="btnOrderSell" onclick="switchOrderType('sell')">판매</button>
        </div>

        <div class="input-container">
          <input type="text" id="orderAmountInput" placeholder="얼마나 주문할까요?" inputmode="numeric" oninput="formatOrderInput(this)">
          <span class="input-suffix">원</span>
        </div>
        <div class="estimated-qty" id="estimatedQty">예상 수량: 0주</div>

        <div class="quick-amounts">
          <button onclick="addOrderAmount(10000)">+1만</button>
          <button onclick="addOrderAmount(50000)">+5만</button>
          <button onclick="addOrderAmount(100000)">+10만</button>
          <button onclick="addOrderAmount('max')">최대</button>
        </div>
      </div>

      <div class="sheet-footer">
        <button class="toss-btn primary" id="btnExecuteOrder" onclick="executeOrder()">주문하기</button>
      </div>
    </div>
  </div>

  <!-- Settings Drawer -->
  <div class="bottom-sheet-overlay" id="settingsSheetOverlay" onclick="closeSettingsSheet(event)">
    <div class="bottom-sheet" id="settingsSheet">
      <div class="sheet-handle"></div>
      <h3 style="margin-bottom: 24px; font-size: 20px; font-weight: 800;">설정</h3>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <button class="toss-btn secondary" onclick="resetMockData()">초기 투자금 재설정 (₩10,000,000)</button>
        <button class="toss-btn secondary" style="color:var(--red);" onclick="clearAllData()">모든 데이터 초기화</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toss-toast" id="toastMsg">알림 메시지</div>

  <script src="app.js?v=premium1"></script>
</body>
</html>
