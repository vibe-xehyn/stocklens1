<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockLens - 주식 투자 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
<style>
  :root {
    --bg: #0d0f18; --surface: #161929; --surface2: #1e2236; --surface3: #252840;
    --border: #2a2e45; --border2: #343858;
    --text: #e1e7f0; --text2: #a0abc0; --muted: #6b7a95;
    --accent: #4f8ef7; --accent2: #3b7aec;
    --green: #22c55e; --green2: #16a34a;
    --red: #ef4444; --red2: #b91c1c;
    --yellow: #f59e0b;
    --radius: 10px; --radius-sm: 6px;
    --shadow: 0 1px 3px rgba(0,0,0,0.4), 0 1px 8px rgba(0,0,0,0.2);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-x: clip; background: var(--bg); }
  body { overflow-x: clip; max-width: 100%; background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', -apple-system, 'Segoe UI', system-ui, sans-serif; min-height: 100vh; line-height: 1.5; }

  /* ── 스크롤바 ── */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  /* 모바일: 가로 스크롤은 명시적으로 표시된 영역(.h-scroll)에서만 발생 */
  .h-scroll {
    overflow-x: auto; overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    scroll-snap-type: x proximity;
  }
  .h-scroll::-webkit-scrollbar { height: 6px; }
  .h-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .h-scroll > * { scroll-snap-align: start; }

  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100; gap: 12px;
  }
  .logo { font-size: 18px; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; flex-shrink: 0; }
  .logo span { color: var(--text); font-weight: 600; }
  .market-bar { display: flex; gap: 16px; font-size: 12px; }
  .market-item { display: flex; flex-direction: column; align-items: center; }
  .market-name { color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .market-val { font-weight: 700; font-size: 12px; margin-top: 1px; }
  .up { color: var(--green); } .down { color: var(--red); }
  .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  .market-status { display: flex; align-items: center; gap: 8px; }
  .market-status-item { display: inline-flex; align-items: center; gap: 4px; }
  .market-status-label { font-size: 10px; color: var(--text2); letter-spacing: 0.5px; font-weight: 700; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .header-time { font-size: 11px; color: var(--muted); }
  .refresh-btn {
    padding: 5px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all 0.18s;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(79,142,247,0.06); }
  .refresh-btn.spinning { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .container { display: grid; grid-template-columns: 252px 1fr; min-height: calc(100vh - 56px); }

  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 14px 0; overflow-y: auto;
    height: calc(100vh - 56px); position: sticky; top: 56px;
  }
  .sidebar-search { margin: 0 10px 10px; position: relative; }
  .sidebar-search input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 8px 12px; color: var(--text); font-size: 13px; outline: none;
    transition: border-color 0.15s;
  }
  .sidebar-search input::placeholder { color: var(--muted); }
  .sidebar-search input:focus { border-color: var(--accent); background: var(--surface3); }
  .market-tabs { display: flex; margin: 0 10px 10px; gap: 3px; background: var(--surface2); border-radius: var(--radius-sm); padding: 3px; }
  .market-tab {
    flex: 1; padding: 5px; font-size: 11px; font-weight: 700; text-align: center;
    border-radius: 4px; cursor: pointer; border: none;
    background: transparent; color: var(--muted); transition: all 0.18s;
  }
  .market-tab.active { background: var(--accent2); color: #fff; }
  .market-tab:not(.active):hover { color: var(--text); }
  .search-result-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: pointer; transition: background 0.12s;
    border-left: 2px solid transparent;
  }
  .search-result-item:hover { background: var(--surface2); border-left-color: var(--accent); }
  .result-type { font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 700; margin-left: 5px; }
  .type-ETF { background: rgba(245,158,11,0.12); color: #f59e0b; }
  .type-EQUITY, .type-stock { background: rgba(79,142,247,0.12); color: #7bb3fa; }
  .section-label {
    font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.8px; padding: 10px 14px 4px;
  }
  .stock-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 14px; cursor: pointer; transition: background 0.12s;
    border-left: 2px solid transparent;
  }
  .stock-item:hover { background: var(--surface2); }
  .stock-item.active { background: var(--surface2); border-left-color: var(--accent); }
  .stock-left .ticker { font-size: 13px; font-weight: 700; letter-spacing: -0.2px; }
  .stock-left .sname { font-size: 11px; color: var(--muted); margin-top: 1px; }
  .stock-right { text-align: right; }
  .stock-price { font-size: 12px; font-weight: 600; }
  .stock-chg { font-size: 11px; margin-top: 1px; }
  .skeleton { background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%); background-size: 200%; animation: shimmer 1.5s infinite; border-radius: 4px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  main { padding: 24px; overflow-y: auto; }

  .stock-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 24px; gap: 16px; flex-wrap: nowrap;
  }
  .stock-title h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .stock-title .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-right: 6px; margin-top: 6px; font-weight: 600; }
  .badge-kr { background: #1e3a5f; color: #60a5fa; }
  .badge-us { background: #1a3a2a; color: #4ade80; }
  .badge-KOSPI { background: #1e3a5f; color: #60a5fa; }
  .badge-KOSDAQ { background: #2d1f5e; color: #c084fc; }
  .badge-NASDAQ { background: #1a3a2a; color: #4ade80; }
  .badge-NYSE { background: #1f3a2a; color: #34d399; }
  .price-block { text-align: right; }
  .current-price { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
  .price-change { font-size: 16px; font-weight: 600; margin-top: 4px; }
  .analyst-box {
    margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: rgba(59,130,246,0.1); border: 1px solid rgba(59,130,246,0.3); color: var(--accent);
  }

  .cards-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
  .card-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
  .card-value { font-size: 20px; font-weight: 700; margin-top: 5px; letter-spacing: -0.5px; }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .indicator-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .indicator-fill { height: 100%; border-radius: 2px; transition: width 0.6s; }

  .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }

  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .chart-title { font-size: 14px; font-weight: 700; letter-spacing: -0.2px; }
  .chart-tabs { display: flex; gap: 3px; background: var(--surface2); border-radius: var(--radius-sm); padding: 2px; }
  .chart-tab {
    padding: 4px 10px; font-size: 11px; font-weight: 700; border-radius: 4px;
    cursor: pointer; border: none; background: transparent;
    color: var(--muted); transition: all 0.15s;
  }
  .chart-tab.active { background: var(--accent2); color: #fff; }
  .chart-tab:not(.active):hover { color: var(--text); }

  .indicators-table { width: 100%; border-collapse: collapse; }
  .indicators-table th {
    font-size: 11px; color: var(--muted); text-align: left; padding: 8px 0;
    border-bottom: 1px solid var(--border); font-weight: 600; text-transform: uppercase;
  }
  .indicators-table td { padding: 9px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .indicators-table tr:last-child td { border-bottom: none; }
  .ind-name { color: var(--muted); }
  .ind-val { font-weight: 600; text-align: right; }
  .ind-grade { text-align: right; font-size: 11px; font-weight: 700; }
  .grade-good { color: var(--green); } .grade-neutral { color: var(--yellow); } .grade-bad { color: var(--red); }

  .news-item { padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .news-item:last-child { border-bottom: none; }
  .news-item:hover .news-title { color: var(--accent); }
  .news-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .news-source { font-size: 11px; font-weight: 700; color: var(--accent); }
  .news-time { font-size: 11px; color: var(--muted); }
  .news-title { font-size: 13px; font-weight: 600; line-height: 1.4; transition: color 0.15s; }

  .fin-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .fin-row:last-child { border-bottom: none; }
  .fin-label { color: var(--muted); }
  .fin-val { font-weight: 600; }

  .score-section { display: flex; align-items: center; gap: 20px; }
  .score-ring { position: relative; width: 90px; height: 90px; flex-shrink: 0; }
  .score-ring svg { transform: rotate(-90deg); }
  .score-number { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 22px; font-weight: 800; }
  .score-details { flex: 1; }
  .score-bar-item { margin-bottom: 8px; }
  .score-bar-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .score-bar-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s; }

  .watchlist-btn {
    padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; font-weight: 600; transition: all 0.2s;
  }
  .watchlist-btn:hover { border-color: var(--yellow); color: var(--yellow); }
  .watchlist-btn.watching { background: rgba(245,158,11,0.1); border-color: var(--yellow); color: var(--yellow); }

  /* Home Screen */
  .home-wrap { padding: 20px 24px; }
  .home-hero { text-align: center; padding: 32px 0 28px; }
  .home-hero h1 { font-size: 40px; font-weight: 900; letter-spacing: -2px; margin-bottom: 8px; }
  .home-hero h1 span { color: var(--accent); }
  .home-hero p { color: var(--muted); font-size: 14px; }
  .home-indices { display: grid; grid-template-columns: repeat(5,1fr); gap: 10px; margin-bottom: 24px; }
  @media(max-width:900px){ .home-indices { grid-template-columns: repeat(3,1fr); } }
  .home-idx-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 14px; text-align: center; box-shadow: var(--shadow);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .home-idx-card:hover { border-color: var(--border2); box-shadow: var(--shadow-md); }
  .home-idx-name { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .home-idx-val { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; }
  .home-idx-chg { font-size: 12px; font-weight: 600; margin-top: 3px; }
  .home-stocks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
  @media(max-width:700px){ .home-stocks-grid { grid-template-columns: 1fr; } }
  .home-section-title { font-size: 15px; font-weight: 800; margin-bottom: 14px; color: var(--text); letter-spacing: -0.3px; }
  .home-stock-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s; margin: 0 -4px; padding-left: 4px; padding-right: 4px; border-radius: 4px; }
  .home-stock-row:last-child { border-bottom: none; }
  .home-stock-row:hover { background: var(--surface2); border-bottom-color: transparent; }
  .home-stock-info { display: flex; flex-direction: column; }
  .home-stock-ticker { font-size: 13px; font-weight: 700; }
  .home-stock-name { font-size: 11px; color: var(--muted); }
  .home-stock-price { text-align: right; }
  .home-stock-pval { font-size: 13px; font-weight: 600; }
  .home-stock-pchg { font-size: 11px; }
  .idx-detail-header { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:24px; flex-wrap:wrap; gap:12px; }
  .idx-range-tabs { display:flex; gap:4px; }
  .back-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:12px; cursor:pointer; margin-bottom:20px; transition:all 0.2s; }
  .back-btn:hover { border-color:var(--accent); color:var(--accent); }

  /* AI Analysis Card */
  .ai-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 24px; position: relative; overflow: hidden;
  }
  .ai-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
  }
  .ai-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .ai-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .ai-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 700; letter-spacing: 0.5px; background: rgba(139,92,246,0.15); color: #a78bfa; }
  .ai-signal {
    display: flex; align-items: center; gap: 12px;
  }
  .signal-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 16px; border-radius: 20px; font-size: 16px; font-weight: 800; letter-spacing: 0.5px;
  }
  .signal-strong-buy  { background: rgba(34,197,94,0.25);  color: #16a34a; border: 1px solid rgba(34,197,94,0.5);  font-weight:800; }
  .signal-buy         { background: rgba(34,197,94,0.15);  color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
  .signal-weak-buy    { background: rgba(134,239,172,0.12); color: #86efac; border: 1px solid rgba(134,239,172,0.3); }
  .signal-neutral     { background: rgba(245,158,11,0.15);  color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .signal-weak-sell   { background: rgba(251,146,60,0.12);  color: #fb923c; border: 1px solid rgba(251,146,60,0.3); }
  .signal-sell        { background: rgba(239,68,68,0.15);   color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
  .signal-strong-sell { background: rgba(239,68,68,0.25);   color: #b91c1c; border: 1px solid rgba(239,68,68,0.5);  font-weight:800; }
  .confidence-bar-wrap { flex: 1; max-width: 120px; }
  .confidence-label { font-size: 10px; color: var(--muted); margin-bottom: 3px; display: flex; justify-content: space-between; }
  .confidence-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .confidence-fill { height: 100%; border-radius: 3px; transition: width 0.8s; }
  .ai-summary { font-size: 13px; line-height: 1.6; color: var(--text); margin-bottom: 14px; padding: 12px; background: var(--surface2); border-radius: 8px; }
  .ai-breakdown { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (max-width: 900px) { .ai-breakdown { grid-template-columns: 1fr; } }
  .ai-reason { padding: 10px 12px; background: var(--surface2); border-radius: 8px; font-size: 12px; }
  .ai-reason-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
  .ai-reason-text { color: var(--text); line-height: 1.5; }
  .ai-loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px; padding: 12px 0; }
  .ai-error { color: var(--muted); font-size: 13px; padding: 8px 0; }

  .error-box {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 8px; padding: 12px 16px; color: var(--red); font-size: 13px; margin-bottom: 16px;
  }
  .loading-overlay {
    display: flex; align-items: center; justify-content: center;
    min-height: 200px; color: var(--muted); gap: 10px; font-size: 14px;
  }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }

  @media (max-width: 1200px) { .cards-grid { grid-template-columns: repeat(2,1fr); } }
  @media (max-width: 900px) {
    .container { grid-template-columns: 1fr; }
    aside { display: none; }
    .two-col, .three-col { grid-template-columns: 1fr; }
  }

  /* ── Mobile Bottom Tab Bar ────────────────────────────────── */
  .bottom-nav {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
    background: var(--surface); border-top: 1px solid var(--border);
  }
  .bottom-nav-inner { display: flex; height: 60px; padding-bottom: env(safe-area-inset-bottom); }
  .bnav-tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; cursor: pointer; color: var(--muted); font-size: 10px; font-weight: 600;
    border: none; background: transparent; transition: color 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .bnav-tab svg { width: 22px; height: 22px; }
  .bnav-tab.active { color: var(--accent); }

  /* Mobile drawer (종목 리스트) */
  .mobile-drawer {
    display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 60px; z-index: 150;
    background: var(--surface); flex-direction: column; overflow-y: auto;
  }
  .mobile-drawer.open { display: flex; flex-direction: column; }

  /* Mobile search drawer */
  .mobile-search-drawer {
    display: none; position: fixed; top: 60px; left: 0; right: 0; bottom: 60px; z-index: 151;
    background: var(--bg); flex-direction: column;
  }
  .mobile-search-drawer.open { display: flex; }
  .mobile-search-header {
    padding: 10px 12px; display: flex; align-items: center; gap: 8px;
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  .mobile-search-header input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 14px; color: var(--text); font-size: 15px; outline: none;
  }
  .mobile-search-header input:focus { border-color: var(--accent); }
  .mobile-search-cancel {
    color: var(--accent); font-size: 14px; font-weight: 600; cursor: pointer;
    border: none; background: transparent; padding: 8px 4px; white-space: nowrap;
  }
  .mobile-search-results { flex: 1; overflow-y: auto; }

  @media (max-width: 768px) {
    .bottom-nav { display: block; }
    main { padding: 16px; padding-bottom: 76px; max-width: 100vw; overflow-x: hidden; }
    .home-wrap { padding: 16px; padding-bottom: 76px; max-width: 100vw; overflow-x: hidden; }
    .market-bar { display: none; }
    .header-time { display: none; }
    .refresh-btn { font-size: 11px; padding: 4px 8px; }
    header { padding: 0 14px; height: 52px; }
    .home-hero { padding: 20px 0 16px; }

function STOCK_DEF(id) { return STOCK_DEFS.find(s => s.id === id); }

// ── API ───────────────────────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const d = await res.json();
  if (d.error) throw new Error(d.error);
  return d;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
let ratesCache = {};
let indicesCache = [];
let macroCache = {};

async function loadRates() {
  try {
    ratesCache = await api('/api/rates');
    renderRates();
  } catch {}
}

function renderRates() {
  const el = document.getElementById('ratesBar');
  if (!el || !ratesCache) return;
  const r = ratesCache;
  const fmt = (v, d=2) => v != null ? v.toFixed(d) : '-';
  const chgColor = c => c > 0 ? 'var(--red)' : c < 0 ? 'var(--green)' : 'var(--muted)';
  el.innerHTML = [
    r.usdkrw ? `<span class="rate-item"><span class="rate-name">USD/KRW</span> <span style="font-weight:700">${fmt(r.usdkrw.value,0)}원</span> <span style="color:${chgColor(r.usdkrw.change)};font-size:10px">${r.usdkrw.change>0?'▲':'▼'}${Math.abs(r.usdkrw.change).toFixed(2)}%</span></span>` : '',
    r.dxy    ? `<span class="rate-item"><span class="rate-name">DXY</span> <span style="font-weight:700">${fmt(r.dxy.value)}</span> <span style="color:${chgColor(r.dxy.change)};font-size:10px">${r.dxy.change>0?'▲':'▼'}${Math.abs(r.dxy.change).toFixed(2)}%</span></span>` : '',
    r.eurusd ? `<span class="rate-item"><span class="rate-name">EUR/USD</span> <span style="font-weight:700">${fmt(r.eurusd.value,4)}</span></span>` : '',
    r.usdjpy ? `<span class="rate-item"><span class="rate-name">USD/JPY</span> <span style="font-weight:700">${fmt(r.usdjpy.value,2)}</span></span>` : '',
  ].filter(Boolean).join('');
}

async function init() {
  startClock();
  // /api/init 으로 trading-status + indices + rates 한 번에 로딩
  await Promise.all([fetchInit(), loadAllSidebar()]);
  renderSidebar();
  updateTradingBadge();
  await renderHome();
  scheduleAutoRefresh();
}

let tradingStatus = { kr: false, us: false };

async function fetchInit() {
  try {
    const d = await api('/api/init');
    tradingStatus = d.trading || tradingStatus;
    if (d.indices?.length) {
      indicesCache = d.indices;
      document.getElementById('marketBar').innerHTML = d.indices.map(m => {
        const up = m.change >= 0;
        return `<div class="market-item" onclick="viewIndex(${JSON.stringify(m).replace(/"/g,'&quot;')})" style="cursor:pointer;padding:4px 6px;border-radius:6px;transition:background 0.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
          <span class="market-name">${m.name}</span>
          <span class="market-val ${up?'up':'down'}">${m.value.toLocaleString(undefined,{maximumFractionDigits:2})} <small>${up?'+':''}${m.change.toFixed(2)}%</small></span>
        </div>`;
      }).join('');
    }
    if (d.rates && Object.keys(d.rates).length) { ratesCache = d.rates; renderRates(); }
  } catch {
    // 폴백: 개별 요청
    await fetchTradingStatus();
    await Promise.all([loadIndices(), loadRates()]);
  }
}

async function fetchTradingStatus() {
  try { tradingStatus = await api('/api/trading-status'); } catch {}
}

function currentInterval() {
  const krActive = tradingStatus.kr;
  const usActive = tradingStatus.us;
  // 어느 쪽이든 장중이면 15초, 둘 다 장마감이면 90초
  return (krActive || usActive) ? 15_000 : 90_000;
}

function scheduleAutoRefresh() {
  clearTimeout(autoRefreshTimer);

  const tick = async () => {
    await fetchTradingStatus();
    await Promise.all([loadIndices(), loadAllSidebar()]);
    renderSidebar();
    renderPriceBlock(currentDef);
    updateTradingBadge();
    autoRefreshTimer = setTimeout(tick, currentInterval());
  };

  autoRefreshTimer = setTimeout(tick, currentInterval());
}

function updateTradingBadge() {
  const krActive = tradingStatus.kr;
  const usActive = tradingStatus.us;
  const dotKr = document.getElementById('dotKr');
  const dotUs = document.getElementById('dotUs');
  if (dotKr) {
    dotKr.style.background = krActive ? 'var(--green)' : 'var(--red)';
    dotKr.style.animation = krActive ? 'pulse 2s infinite' : 'none';
    dotKr.title = krActive ? '한국 장중' : '한국 장마감';
  }
  if (dotUs) {
    dotUs.style.background = usActive ? 'var(--green)' : 'var(--red)';
    dotUs.style.animation = usActive ? 'pulse 2s infinite' : 'none';
    dotUs.title = usActive ? '미국 장중' : '미국 장마감';
  }
  // 기존 뱃지 제거
  const old = document.getElementById('tradingBadge');
  if (old) old.remove();
}

async function refreshAll() {
  const btn = document.getElementById('refreshBtn');
  if (btn.classList.contains('spinning')) return; // 중복 클릭 방지
  btn.classList.add('spinning');
  clearTimeout(autoRefreshTimer);
  delete quoteCache[currentDef.id];
  await fetchTradingStatus();
  await Promise.all([loadIndices(), loadAllSidebar()]);
  renderSidebar();
  updateTradingBadge();
  await loadAndRenderMain(currentDef);
  btn.classList.remove('spinning');
  scheduleAutoRefresh();
}

// ── 지수 로딩 ─────────────────────────────────────────────────────────────────
async function loadIndices() {
  try {
    indicesCache = await api('/api/indices');
    document.getElementById('marketBar').innerHTML = indicesCache.map(m => {
      const up = m.change >= 0;
      return `<div class="market-item" onclick="viewIndex(${JSON.stringify(m).replace(/"/g,'&quot;')})" style="cursor:pointer;padding:4px 6px;border-radius:6px;transition:background 0.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
        <span class="market-name">${m.name}</span>
        <span class="market-val ${up ? 'up' : 'down'}">${m.value.toLocaleString(undefined,{maximumFractionDigits:2})} <small>${up?'+':''}${m.change.toFixed(2)}%</small></span>
      </div>`;
    }).join('');
  } catch(e) { console.error('indices error', e); }
}

// ── 사이드바 시세 로딩 (Stooq/NAVER — 빠름, Yahoo 미사용) ───────────────────────
async function loadAllSidebar() {
  const krDefs = STOCK_DEFS.filter(d => d.market === 'kr');
  const usDefs = STOCK_DEFS.filter(d => d.market === 'us');

  await Promise.allSettled([
    // KR: 배치 조회
    (async () => {
      try {
        const syms = krDefs.map(d => d.ticker).join(',');
        const result = await api(`/api/sidebar-batch?symbols=${syms}&market=kr`);
        krDefs.forEach(def => {
          const q = result[def.ticker];
          if (q?.price) sidebarCache[def.id] = { ...def, ...q };
        });
      } catch {}
    })(),
    // US: 배치 조회 (yfinance download - 한 번에)
    (async () => {
      try {
        const syms = usDefs.map(d => d.ticker).join(',');
        const result = await api(`/api/sidebar-batch?symbols=${syms}&market=us`);
        usDefs.forEach(def => {
          const q = result[def.ticker];
          if (q?.price) sidebarCache[def.id] = { ...def, ...q };
        });
      } catch {}
    })(),
  ]);
}

// ── 사이드바 ──────────────────────────────────────────────────────────────────
function renderSidebar(filter = '') {
  const markets = currentMarket === 'all' ? ['kr', 'us'] : [currentMarket];
  const labels = { kr: '한국 주식', us: '미국 주식' };
  let html = '';
  markets.forEach(m => {
    const items = STOCK_DEFS.filter(s =>
      s.market === m &&
      (s.name.toLowerCase().includes(filter.toLowerCase()) ||
       s.displayTicker.toLowerCase().includes(filter.toLowerCase()))
    );
    if (!items.length) return;
    html += `<div class="section-label">${labels[m]}</div>`;
    items.forEach(def => {
      const q = sidebarCache[def.id] || quoteCache[def.id];
      const up = q ? q.changePct >= 0 : true;
      const sym = def.market === 'kr' ? '₩' : '$';
      const priceStr = q ? sym + (q.price||0).toLocaleString(undefined,{maximumFractionDigits:2}) : '···';
      const chgStr = q ? `${up?'+':''}${(q.changePct||0).toFixed(2)}%` : '';
      const isKrStock = def.market === 'kr';
      const usdkrw = ratesCache?.usdkrw?.value;
      const krwStr = (!isKrStock && q?.price && usdkrw)
        ? `<div style="font-size:9px;color:var(--muted)">≈ ₩${Math.round(q.price * usdkrw).toLocaleString()}</div>` : '';
      html += `
        <div class="stock-item ${def.id === currentDef.id ? 'active' : ''}" onclick="selectStock('${def.id}')">
          <div class="stock-left">
            <div class="ticker">${isKrStock ? def.name : def.displayTicker}</div>
            <div class="sname">${isKrStock ? def.displayTicker : def.name}</div>
          </div>
          <div class="stock-right">
            <div class="stock-price ${up ? 'up' : 'down'}">${priceStr}</div>
            <div class="stock-chg ${up ? 'up' : 'down'}">${chgStr}</div>
            ${krwStr}
          </div>
        </div>`;
    });
  });
  document.getElementById('stockList').innerHTML = html;
}

// ── 종목 검색 ─────────────────────────────────────────────────────────────────
let _searchTimer = null;

function onSearchInput(q) {
  clearTimeout(_searchTimer);
  const el = document.getElementById('searchResultsList');
  const listEl = document.getElementById('stockList');
  if (!q.trim()) {
    el.innerHTML = '';
    listEl.style.display = '';
    renderSidebar();
    return;
  }
  listEl.style.display = 'none';
  el.innerHTML = `<div class="loading-overlay" style="min-height:60px;font-size:12px"><div class="spinner"></div> 검색 중...</div>`;
  _searchTimer = setTimeout(() => doSearch(q.trim()), 300);
}

async function doSearch(q) {
  const el = document.getElementById('searchResultsList');
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(q)}&market=all`);
    if (!results.length) {
      el.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--muted)">검색 결과 없음</div>`;
      return;
    }
    const krItems = results.filter(r => r.market === 'kr');
    const usItems = results.filter(r => r.market === 'us');
    let html = '';
    if (krItems.length) {
      html += `<div class="section-label">한국 주식 / ETF</div>`;
      html += krItems.map(r => searchResultHTML(r)).join('');
    }
    if (usItems.length) {
      html += `<div class="section-label">미국 주식 / ETF</div>`;
      html += usItems.map(r => searchResultHTML(r)).join('');
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div style="padding:16px;font-size:12px;color:var(--red)">검색 오류: ${e.message}</div>`;
  }
}

function searchResultHTML(r) {
  const typeLabel = r.type === 'ETF' ? 'ETF' : r.type === 'stock' ? '주식' : 'EQUITY';
  const typeCls = r.type === 'ETF' ? 'type-ETF' : 'type-EQUITY';
  const sym = r.market === 'kr' ? '₩' : '$';
  const cached = sidebarCache[r.ticker] || {};
  const price = cached.price ? sym + cached.price.toLocaleString(undefined, {maximumFractionDigits:2}) : '';
  const chg = cached.changePct != null ? `${cached.changePct >= 0 ? '+' : ''}${cached.changePct.toFixed(2)}%` : '';
  return `<div class="search-result-item" onclick="selectSearchResult(${JSON.stringify(r).replace(/"/g,'&quot;')})">
    <div class="stock-left">
      <div class="ticker">${r.ticker} <span class="result-type ${typeCls}">${typeLabel}</span></div>
      <div class="sname">${r.name}</div>
    </div>
    <div class="stock-right" id="srp-${r.ticker}">
      ${price ? `<div class="stock-price ${cached.changePct >= 0 ? 'up' : 'down'}">${price}</div>
      <div class="stock-chg ${cached.changePct >= 0 ? 'up' : 'down'}">${chg}</div>` : ''}
    </div>
  </div>`;
}

async function selectSearchResult(r) {
  // 동적 종목 — STOCK_DEFS에 없으면 임시 추가
  let def = STOCK_DEFS.find(s => s.ticker === r.ticker);
  if (!def) {
    def = {
      id: r.ticker, market: r.market,
      exchange: r.exchange || (r.market === 'kr' ? 'KOSPI' : 'NASDAQ'),
      ticker: r.ticker, displayTicker: r.ticker, name: r.name,
    };
    STOCK_DEFS.push(def);
  }
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResultsList').innerHTML = '';
  document.getElementById('stockList').style.display = '';
  await selectStock(def.id);
}

function switchMarket(m, btn) {
  currentMarket = m;
  document.querySelectorAll('.market-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderSidebar();
}

function filterStocks() { renderSidebar(); }

// ── 메인 렌더링 ───────────────────────────────────────────────────────────────
async function loadAndRenderMain(def) {
  document.getElementById('mainContent').innerHTML =
    `<div class="loading-overlay"><div class="spinner"></div> ${def.name} 데이터 로딩 중...</div>`;
  try {
    // Quote and chart load in parallel; news after (also uses Yahoo queue)
    const [q, chart] = await Promise.all([
      quoteCache[def.id]
        ? Promise.resolve(quoteCache[def.id])
        : api(`/api/quote?symbol=${def.ticker}&market=${def.market}`),
      api(`/api/chart?symbol=${def.ticker}&range=${currentRange}&market=${def.market}`),
    ]);
    quoteCache[def.id] = { ...def, ...q };
    // Render immediately with quote+chart, then load AI analysis and news async
    renderMain(def, q, chart, []);
    // Load all async data in parallel
    const [news] = await Promise.all([
      api(`/api/news?symbol=${def.ticker}&market=${def.market}`).catch(() => []),
      loadAIAnalysis(def),
      api(`/api/flow?symbol=${def.ticker}&market=${def.market}`).then(d => {
        const el = document.getElementById('flowContainer');
        if (el) el.innerHTML = renderFlowHTML(d, def.market === 'us');
      }).catch(() => {
        const el = document.getElementById('flowContainer');
        if (el) el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px">수급 데이터 없음</div>';
      }),
      api(`/api/earnings?symbol=${def.ticker}&market=${def.market}`).then(d => {
        const el = document.getElementById('earningsContainer');
        if (el) el.innerHTML = renderEarningsHTML(d, def.market === 'kr', def.market === 'kr' ? '₩' : '$');
      }).catch(() => {
        const el = document.getElementById('earningsContainer');
        if (el) el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px">실적 데이터 없음</div>';
      }),
      api(`/api/peers?symbol=${def.ticker}&market=${def.market}`).then(d => {
        const el = document.getElementById('peersContainer');
        if (el) el.innerHTML = renderPeersHTML(d, def.market === 'kr' ? '₩' : '$');
      }).catch(() => {
        const el = document.getElementById('peersContainer');
        if (el) el.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:8px">비교 데이터 없음</div>';
      }),
    ]);
    const newsEl = document.getElementById('newsContainer');
    if (newsEl) newsEl.innerHTML = newsHTML(news);
  } catch(e) {
    document.getElementById('mainContent').innerHTML =
      `<div class="error-box">데이터 로딩 실패: ${e.message}<br>서버가 실행 중인지 확인하세요 (npm start)</div>`;
  }
}

// ── 분기 실적 렌더링 ──────────────────────────────────────────────────────────
function renderEarningsHTML(d, isKr, sym) {
  if (!d) return '<div style="color:var(--muted);font-size:13px">데이터 없음</div>';
  const fmtNum = (v, unit='') => v != null ? (Math.abs(v)>=1e12 ? (v/1e12).toFixed(1)+'T' : Math.abs(v)>=1e9 ? (v/1e9).toFixed(1)+'B' : Math.abs(v)>=1e8 ? (v/1e8).toFixed(0)+'억' : v.toLocaleString()) + unit : 'N/A';
  const pct = v => v != null ? (v>0?'+':'')+v.toFixed(1)+'%' : 'N/A';

  let html = '<div style="display:flex;flex-direction:column;gap:20px">';

  // 애널리스트 추천 분포
  const total = (d.recStrongBuy||0)+(d.recBuy||0)+(d.recHold||0)+(d.recSell||0)+(d.recStrongSell||0);
  if (total > 0) {
    const buyPct = Math.round(((d.recStrongBuy||0)+(d.recBuy||0))/total*100);
    const holdPct = Math.round((d.recHold||0)/total*100);
    const sellPct = 100-buyPct-holdPct;
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:10px">애널리스트 추천 (${total}명)</div>
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
        <div style="flex:1;background:var(--surface2);border-radius:6px;overflow:hidden;height:10px;display:flex">
          <div style="width:${buyPct}%;background:var(--green)"></div>
          <div style="width:${holdPct}%;background:var(--yellow)"></div>
          <div style="width:${sellPct}%;background:var(--red)"></div>
        </div>
      </div>
      <div style="display:flex;gap:16px;font-size:12px">
        <span><span style="color:var(--green);font-weight:700">${d.recStrongBuy||0}</span> 강력매수</span>
        <span><span style="color:var(--green)">${d.recBuy||0}</span> 매수</span>
        <span><span style="color:var(--yellow)">${d.recHold||0}</span> 중립</span>
        <span><span style="color:var(--red)">${d.recSell||0}</span> 매도</span>
        <span><span style="color:var(--red);font-weight:700">${d.recStrongSell||0}</span> 강력매도</span>
      </div>
    </div>`;
  }

  // 목표주가
  if (d.targetMean) {
    const cur = d.currentPrice;
    const upside = cur ? ((d.targetMean - cur) / cur * 100).toFixed(1) : null;
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:10px">목표주가 분포</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div style="text-align:center"><div style="font-size:10px;color:var(--muted)">최저</div><div style="font-weight:700;color:var(--red)">${sym}${(d.targetLow||0).toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
        <div style="text-align:center"><div style="font-size:10px;color:var(--muted)">평균</div><div style="font-weight:700;color:var(--accent);font-size:16px">${sym}${(d.targetMean||0).toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
        <div style="text-align:center"><div style="font-size:10px;color:var(--muted)">최고</div><div style="font-weight:700;color:var(--green)">${sym}${(d.targetHigh||0).toLocaleString(undefined,{maximumFractionDigits:0})}</div></div>
        ${upside ? `<div style="text-align:center"><div style="font-size:10px;color:var(--muted)">상승여력</div><div style="font-weight:700;color:${parseFloat(upside)>0?'var(--green)':'var(--red)'}">${upside}%</div></div>` : ''}
      </div>
    </div>`;
  }

  // 다음 어닝 / 배당
  if (d.nextEarningsDate || d.dividendDate) {
    html += `<div style="display:flex;gap:16px;flex-wrap:wrap">
      ${d.nextEarningsDate && d.nextEarningsDate !== 'None' ? `<div style="background:var(--surface2);border-radius:8px;padding:10px 14px">
        <div style="font-size:10px;color:var(--muted);font-weight:700">다음 실적발표</div>
        <div style="font-weight:700;margin-top:4px;color:var(--yellow)">${d.nextEarningsDate}</div>
        ${d.epsEstimateNext ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">EPS 예상 ${sym}${d.epsEstimateNext?.toFixed(2)} (${sym}${d.epsEstimateLow?.toFixed(2)}~${sym}${d.epsEstimateHigh?.toFixed(2)})</div>` : ''}
      </div>` : ''}
      ${d.dividendDate && d.dividendDate !== 'None' ? `<div style="background:var(--surface2);border-radius:8px;padding:10px 14px">
        <div style="font-size:10px;color:var(--muted);font-weight:700">배당지급일 / 배당락일</div>
        <div style="font-weight:700;margin-top:4px;color:var(--green)">${d.dividendDate}</div>
        ${d.exDividendDate ? `<div style="font-size:11px;color:var(--muted);margin-top:2px">배당락: ${d.exDividendDate}</div>` : ''}
      </div>` : ''}
    </div>`;
  }

  // EPS 어닝 서프라이즈 히스토리
  if (d.earningsHistory?.length) {
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;margin-bottom:10px">EPS 실적 vs 추정 (최근 ${d.earningsHistory.length}분기)</div>
      <div style="display:flex;gap:6px;align-items:flex-end;height:80px">
        ${d.earningsHistory.slice(-6).map(e => {
          const beat = e.surprise > 0;
          const barH = Math.min(100, Math.abs(e.surprise * 3) + 20);
          return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px">
            <div style="font-size:9px;color:${beat?'var(--green)':'var(--red)'};font-weight:700">${e.surprise>0?'+':''}${e.surprise?.toFixed(1)}%</div>
            <div style="width:100%;height:${barH}px;background:${beat?'rgba(34,197,94,0.3)':'rgba(239,68,68,0.3)'};border-radius:3px;border-bottom:2px solid ${beat?'var(--green)':'var(--red)'}"></div>
            <div style="font-size:9px;color:var(--muted);white-space:nowrap">${(e.date||'').slice(0,7)}</div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}

// ── 동종업계 비교 렌더링 ──────────────────────────────────────────────────────
function renderPeersHTML(d, sym) {
  if (!d || !d.peers?.length) return '<div style="color:var(--muted);font-size:13px">비교 데이터 없음</div>';
  const peers = d.peers;
  const fmt = (v, d=1) => v != null ? v.toFixed(d) : 'N/A';
  const fmtCap = v => {
    if (!v) return 'N/A';
    if (v >= 1e12) return (v/1e12).toFixed(1)+'T';
    if (v >= 1e9) return (v/1e9).toFixed(1)+'B';
    if (v >= 1e8) return (v/1e8).toFixed(0)+'억';
    return v.toLocaleString();
  };

  return `<div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:12px">섹터: ${d.sector||'-'} / 업종: ${d.industry||'-'}</div>
    <div class="h-scroll">
      <table class="h-scroll-table" style="width:100%;border-collapse:collapse;font-size:12px">
        <thead>
          <tr style="border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase">
            <th style="text-align:left;padding:6px 8px">종목</th>
            <th style="text-align:right;padding:6px 8px">등락</th>
            <th style="text-align:right;padding:6px 8px">PER</th>
            <th style="text-align:right;padding:6px 8px">PBR</th>
            <th style="text-align:right;padding:6px 8px">ROE</th>
            <th style="text-align:right;padding:6px 8px">매출성장</th>
            <th style="text-align:right;padding:6px 8px">순이익률</th>
            <th style="text-align:right;padding:6px 8px">시총</th>
          </tr>
        </thead>
        <tbody>
          ${peers.map(p => {
            const up = (p.changePct||0) >= 0;
            return `<tr style="border-bottom:1px solid rgba(46,50,72,0.5);transition:background 0.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background=''">
              <td style="padding:8px 8px">
                <div style="font-weight:700">${p.ticker}</div>
                <div style="font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px">${p.name}</div>
              </td>
              <td style="text-align:right;padding:8px;color:${up?'var(--green)':'var(--red)'};font-weight:700">${up?'+':''}${fmt(p.changePct)}%</td>
              <td style="text-align:right;padding:8px">${p.per ? fmt(p.per)+'x' : 'N/A'}</td>
              <td style="text-align:right;padding:8px">${p.pbr ? fmt(p.pbr)+'x' : 'N/A'}</td>
              <td style="text-align:right;padding:8px;color:${(p.roe||0)>15?'var(--green)':'var(--text)'}">${p.roe ? fmt(p.roe)+'%' : 'N/A'}</td>
              <td style="text-align:right;padding:8px;color:${(p.revenueGrowth||0)>0?'var(--green)':'var(--red)'}">${p.revenueGrowth ? (p.revenueGrowth>0?'+':'')+fmt(p.revenueGrowth)+'%' : 'N/A'}</td>
              <td style="text-align:right;padding:8px">${p.profitMargin ? fmt(p.profitMargin)+'%' : 'N/A'}</td>
              <td style="text-align:right;padding:8px;color:var(--muted)">${fmtCap(p.marketCap)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

// ── 수급/주주 분석 렌더링 ──────────────────────────────────────────────────────
function renderFlowHTML(d, isUs) {
  if (!d || Object.keys(d).filter(k=>!k.startsWith('_')).length === 0) {
    return '<div style="color:var(--muted);font-size:13px">수급 데이터 없음</div>';
  }
  const pct = v => v != null ? `${v}%` : 'N/A';
  const num = v => v != null ? Number(v).toLocaleString() : 'N/A';

  let html = '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">';

  // 지분율 카드
  html += `<div>
    <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase">지분 구조</div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">내부자 지분</span>
        <span style="font-weight:700;color:var(--accent)">${pct(d.insiderPct)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">기관 지분</span>
        <span style="font-weight:700;color:var(--accent)">${pct(d.institutionPct)}</span>
      </div>
      ${d.institutionsCount ? `<div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">기관 수</span>
        <span style="font-weight:600">${d.institutionsCount.toLocaleString()}개</span>
      </div>` : ''}
      ${isUs && d.shortPct != null ? `<div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">공매도 비율</span>
        <span style="font-weight:700;color:${d.shortPct > 5 ? 'var(--red)' : 'var(--text)'}">${pct(d.shortPct)}</span>
      </div>` : ''}
      ${isUs && d.shortRatio != null ? `<div style="display:flex;justify-content:space-between;font-size:13px">
        <span style="color:var(--muted)">공매도 일수</span>
        <span style="font-weight:600">${d.shortRatio}일</span>
      </div>` : ''}
    </div>
  </div>`;

  // 주요 기관투자자
  if (d.topHolders?.length) {
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase">주요 기관투자자</div>
      <div style="display:flex;flex-direction:column;gap:5px">
        ${d.topHolders.map(h => {
          const chgColor = h.chg > 0 ? 'var(--green)' : h.chg < 0 ? 'var(--red)' : 'var(--muted)';
          const chgArrow = h.chg > 0 ? '▲' : h.chg < 0 ? '▼' : '─';
          return `<div style="font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px">
            <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1" title="${h.name}">${h.name}</span>
            <span style="white-space:nowrap;font-weight:600">${h.pct}%</span>
            <span style="color:${chgColor};font-size:10px;white-space:nowrap">${chgArrow}${Math.abs(h.chg)}%</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 내부자 거래
  if (d.insiderTx?.length) {
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase">내부자 거래</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${d.insiderTx.map(tx => {
          const isSell = (tx.type || '').toLowerCase().includes('sell') || (tx.type || '').includes('매도');
          const color = isSell ? 'var(--red)' : 'var(--green)';
          return `<div style="font-size:12px;border-left:2px solid ${color};padding-left:8px">
            <div style="font-weight:600;color:var(--text)">${tx.name}</div>
            <div style="color:var(--muted);font-size:11px">${tx.title}</div>
            <div style="display:flex;justify-content:space-between;margin-top:2px">
              <span style="color:${color};font-weight:700">${tx.type || '-'}</span>
              <span style="color:var(--muted)">${num(tx.shares)}주 · ${tx.date}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // 옵션 현황 (US only)
  if (isUs && d.options) {
    const o = d.options;
    const pcRatio = o.putCallRatio;
    const pcColor = pcRatio > 1.2 ? 'var(--red)' : pcRatio < 0.7 ? 'var(--green)' : 'var(--yellow)';
    const totalOI = (o.callOI || 0) + (o.putOI || 0);
    const callPct = totalOI > 0 ? Math.round(o.callOI / totalOI * 100) : 50;
    html += `<div>
      <div style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase">옵션 현황 (${o.expiry})</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="color:var(--green)">콜 OI</span>
          <span style="font-weight:700">${num(o.callOI)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="color:var(--red)">풋 OI</span>
          <span style="font-weight:700">${num(o.putOI)}</span>
        </div>
        <div style="background:var(--surface2);border-radius:4px;overflow:hidden;height:6px;margin:2px 0">
          <div style="width:${callPct}%;background:var(--green);height:100%"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="color:var(--muted)">풋/콜 비율</span>
          <span style="font-weight:700;color:${pcColor}">${pcRatio}</span>
        </div>
        ${o.impliedVol != null ? `<div style="display:flex;justify-content:space-between;font-size:13px">
          <span style="color:var(--muted)">내재 변동성</span>
          <span style="font-weight:700">${o.impliedVol}%</span>
        </div>` : ''}
        ${o.maxCallStrike != null ? `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">
          <div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">최대 OI 행사가</div>
          <div style="display:flex;justify-content:space-between;font-size:12px">
            <span style="color:var(--green)">콜 $${o.maxCallStrike.toLocaleString()}</span>
            <span style="color:var(--muted)">${(o.maxCallOI||0).toLocaleString()}계약</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:3px">
            <span style="color:var(--red)">풋 $${o.maxPutStrike.toLocaleString()}</span>
            <span style="color:var(--muted)">${(o.maxPutOI||0).toLocaleString()}계약</span>
          </div>
        </div>` : ''}
      </div>
    </div>`;
  }

  html += '</div>';
  return html;
}

// ── AI 분석 ───────────────────────────────────────────────────────────────────
async function loadAIAnalysis(def) {
  const el = document.getElementById('aiCard');
  if (!el) return;
  try {
    const cached = analysisCache[def.ticker];
    const data = (cached && Date.now() - cached.ts < 10 * 60 * 1000)
      ? cached.data
      : await api(`/api/analysis?symbol=${def.ticker}&market=${def.market}`);
    analysisCache[def.ticker] = { data, ts: Date.now() };
    const q = quoteCache[def.id] || {};
    const up = (q.changePct ?? 0) >= 0;
    const sigClass = {
      '강력매수': 'signal-strong-buy', '매수': 'signal-buy', '약매수': 'signal-weak-buy',
      '중립': 'signal-neutral',
      '약매도': 'signal-weak-sell', '매도': 'signal-sell', '강력매도': 'signal-strong-sell'
    }[data.signal] || 'signal-neutral';
    const sigIcon = {
      '강력매수': '▲▲', '매수': '▲', '약매수': '△',
      '중립': '◆',
      '약매도': '▽', '매도': '▼', '강력매도': '▼▼'
    }[data.signal] || '◆';
    const sigSub = {
      '강력매수': '강한 매수 신호 — 적극 매수 고려',
      '매수': '매수 우위 — 분할 매수 고려',
      '약매수': '소폭 매수 우위 — 소량 진입 고려',
      '중립': '관망 — 추가 신호 확인 후 진입',
      '약매도': '소폭 매도 우위 — 신규 진입 자제',
      '매도': '매도 우위 — 비중 축소 고려',
      '강력매도': '강한 매도 신호 — 손절/매도 고려'
    }[data.signal] || '관망';
    const confColor = data.confidence >= 70 ? '#22c55e' : data.confidence >= 50 ? '#f59e0b' : '#ef4444';
    el.innerHTML = `
      <div class="ai-header">
        <div class="ai-title">AI 투자 의견</div>
        <div class="ai-signal">
          <div>
            <span class="signal-pill ${sigClass}">${sigIcon} ${data.signal}</span>
            <div style="font-size:10px;color:var(--muted);margin-top:4px;padding-left:2px">${sigSub}</div>
          </div>
          <div class="confidence-bar-wrap">
            <div class="confidence-label"><span>확신도</span><span>${data.confidence}%</span></div>
            <div class="confidence-track"><div class="confidence-fill" style="width:${data.confidence}%;background:${confColor}"></div></div>
          </div>
        </div>
      </div>
      ${data.price_move ? `
      <div style="padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:12px;line-height:1.6;
        background:${up?'rgba(34,197,94,0.07)':'rgba(239,68,68,0.07)'};
        border-left:3px solid ${up?'var(--green)':'var(--red)'};color:var(--text)">
        <span style="font-weight:700;color:${up?'var(--green)':'var(--red)'}">${up?'▲ 상승':'▼ 하락'} 원인</span>&nbsp;
        ${data.price_move}
      </div>` : ''}
      <div class="ai-summary">${data.summary}</div>
      <div class="ai-breakdown">
        ${data.technical ? `<div class="ai-reason"><div class="ai-reason-title">기술적 분석</div><div class="ai-reason-text">${data.technical}</div></div>` : ''}
        ${data.fundamental ? `<div class="ai-reason"><div class="ai-reason-title">펀더멘탈</div><div class="ai-reason-text">${data.fundamental}</div></div>` : ''}
        ${data.flow ? `<div class="ai-reason"><div class="ai-reason-title">수급/주주</div><div class="ai-reason-text">${data.flow}</div></div>` : ''}
        ${data.sentiment ? `<div class="ai-reason"><div class="ai-reason-title">뉴스/심리</div><div class="ai-reason-text">${data.sentiment}</div></div>` : ''}
        ${data.risk ? `<div class="ai-reason"><div class="ai-reason-title">리스크</div><div class="ai-reason-text">${data.risk}</div></div>` : ''}
      </div>`;
  } catch(e) {
    if (el) el.innerHTML = `
      <div class="ai-header"><div class="ai-title">AI 투자 의견</div></div>
      <div class="ai-error">${e.message.includes('ANTHROPIC_API_KEY') ? 'ANTHROPIC_API_KEY 환경변수를 설정해주세요.' : 'AI 분석을 불러올 수 없습니다: ' + e.message}</div>`;
  }
}

function newsHTML(news) {
  if (!news.length) return '<div style="color:var(--muted);font-size:13px;padding:16px 0">뉴스를 불러올 수 없습니다.</div>';
  return news.map(n => `
    <div class="news-item" onclick="window.open('${n.url}','_blank')">
      <div class="news-meta">
        <span class="news-source">${n.source}</span>
        <span class="news-time">${n.time}</span>
      </div>
      <div class="news-title">${n.title}</div>
    </div>`).join('');
}

function priceBlockHTML(q, up, sym) {
  const isUs = sym === '$';
  const usdkrw = ratesCache?.usdkrw?.value;
  const krwPrice = (isUs && q.price && usdkrw)
    ? `<div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:2px">≈ ₩${Math.round(q.price * usdkrw).toLocaleString()}</div>`
    : '';
  return `
    <div class="current-price ${up?'up':'down'}">${sym}${q.price?.toLocaleString(undefined,{maximumFractionDigits:2})??'···'}</div>
    ${krwPrice}
    <div class="price-change ${up?'up':'down'}">${up?'+':''}${q.change?.toFixed(2)??''} (${up?'+':''}${q.changePct?.toFixed(2)??''}%)</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px">
      52주 ${sym}${q.low52?.toLocaleString(undefined,{maximumFractionDigits:2})??'-'} – ${sym}${q.high52?.toLocaleString(undefined,{maximumFractionDigits:2})??'-'}
    </div>`;

// ── 점수 계산 ─────────────────────────────────────────────────────────────────
function computeScore(q) {
  const items = {
    '가치': scoreVal(q.per, 30, 10, true) * 0.3 + scoreVal(q.pbr, 4, 1, true) * 0.3 + scoreVal(q.div, 0, 5, false) * 0.4,
    '성장': scoreVal(q.revenueGrowth, -10, 30, false) * 0.6 + scoreVal(q.roe, 5, 25, false) * 0.4,
    '수익성': scoreVal(q.operatingMargin, 5, 30, false) * 0.5 + scoreVal(q.profitMargin, 0, 20, false) * 0.5,
    '안전성': scoreVal(q.debtToEquity, 200, 20, true) * 0.5 + scoreVal(q.currentRatio, 0.8, 2.5, false) * 0.5,
    '모멘텀': q.changePct != null ? Math.min(100, Math.max(0, 50 + q.changePct * 5)) : 50,
  };
  const total = Math.round(Object.values(items).reduce((a,b)=>a+b,0) / Object.keys(items).length);
  return { items, total };
}

function scoreVal(val, bad, good, invert) {
  if (val == null) return 50;
  let pct = (val - bad) / (good - bad);
  if (invert) pct = 1 - pct;
  return Math.min(100, Math.max(0, Math.round(pct * 100)));
}

function scoreHTML(score) {
  const c = scoreColor(score.total);
  return `
    <div class="score-section">
      <div class="score-ring">
        <svg width="90" height="90" viewBox="0 0 90 90">
          <circle cx="45" cy="45" r="36" fill="none" stroke="var(--border)" stroke-width="8"/>
          <circle cx="45" cy="45" r="36" fill="none" stroke="${c}" stroke-width="8"
            stroke-dasharray="${2*Math.PI*36}" stroke-dashoffset="${2*Math.PI*36*(1-score.total/100)}"
            stroke-linecap="round"/>
        </svg>
        <div class="score-number" style="color:${c}">${score.total}</div>
      </div>
      <div class="score-details">
        ${Object.entries(score.items).map(([k,v]) => `
          <div class="score-bar-item">
            <div class="score-bar-label"><span>${k}</span><span>${Math.round(v)}</span></div>
            <div class="score-bar-track"><div class="score-bar-fill" style="width:${v}%;background:${scoreColor(v)}"></div></div>
          </div>`).join('')}
      </div>
    </div>`;
}

function scoreColor(s) {

}

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatPrice(p, cur) {
  if (p == null) return '···';
  const sym = (cur === 'KRW' || cur === 'KRW' || cur === '₩') ? '₩' : '$';
  return sym + p.toLocaleString(undefined, { maximumFractionDigits: 2 });
}

function formatMarketCap(mc, isKr) {
  if (!mc) return '-';
  if (isKr) {
    const jo = mc / 1e12;
    return jo >= 1 ? jo.toFixed(1) + '조' : (mc / 1e8).toFixed(0) + '억';
  }
  // 미국: 달러 + 원화 환산
  const usdkrw = ratesCache?.usdkrw?.value;
  const usdStr = mc >= 1e12 ? '$' + (mc/1e12).toFixed(2) + 'T' : mc >= 1e9 ? '$' + (mc/1e9).toFixed(1) + 'B' : '$' + (mc/1e6).toFixed(0) + 'M';
  if (!usdkrw) return usdStr;
  const krw = mc * usdkrw;
  const krwStr = krw >= 1e12 ? (krw/1e12).toFixed(1) + '조' : (krw/1e8).toFixed(0) + '억';
  return usdStr + ' (≈' + krwStr + ')';
}

function formatVolume(v) {
  if (!v) return '-';
  if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
  if (v >= 1e3) return (v/1e3).toFixed(0) + 'K';
  return v.toString();
}

function formatLargeNum(n, isKr) {
  if (!n) return '-';
  if (isKr) {
    const jo = n / 1e12;
    return jo >= 1 ? jo.toFixed(1) + '조 원' : (n/1e8).toFixed(0) + '억 원';
  }
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9)  return '$' + (n/1e9).toFixed(1) + 'B';
  return '$' + (n/1e6).toFixed(0) + 'M';
}

function range52pct(q) {
  if (!q.low52 || !q.high52 || !q.price) return 50;
  return Math.min(100, Math.max(0, ((q.price - q.low52) / (q.high52 - q.low52) * 100).toFixed(1)));
}

function metricCard(label, val, sub, cls, raw, min, max) {
  const pct = raw != null ? Math.min(100, Math.max(0, ((raw - min) / (max - min)) * 100)) : 50;
  const color = cls === 'grade-good' ? 'var(--green)' : cls === 'grade-neutral' ? 'var(--yellow)' : cls === 'grade-bad' ? 'var(--red)' : 'var(--text)';
  return `<div class="card">
    <div class="card-label">${label}</div>
    <div class="card-value" style="color:${color}">${val ?? 'N/A'}</div>
    <div class="card-sub">${sub}</div>
    <div class="indicator-bar"><div class="indicator-fill" style="width:${pct}%;background:${color}"></div></div>
  </div>`;
}

function gradeClass(val, metric) {
  if (val == null) return '';
  const t = { per:{good:15,ok:25}, pbr:{good:1.5,ok:3}, roe:{good:15,ok:10,inv:true}, div:{good:3,ok:1,inv:true}, operatingMargin:{good:20,ok:10,inv:true}, debtRatio:{good:40,ok:80}, currentRatio:{good:1.5,ok:1,inv:true} }[metric];
  if (!t) return '';
  if (t.inv) return val >= t.good ? 'grade-good' : val >= t.ok ? 'grade-neutral' : 'grade-bad';
  return val <= t.good ? 'grade-good' : val <= t.ok ? 'grade-neutral' : 'grade-bad';
}

function gradeLabel(cls) {
  return { 'grade-good':'우수', 'grade-neutral':'보통', 'grade-bad':'주의' }[cls] || '-';
}

function indRow(name, val, metric, raw) {
  if (!val || val === 'undefinedx' || val === 'undefined%' || val === 'null%' || val === 'nullx') return '';
  const cls = metric ? gradeClass(raw, metric) : '';
  return `<tr>
    <td class="ind-name">${name}</td><td></td>
    <td class="ind-val">${val}</td>
    <td class="ind-grade ${cls}">${cls ? gradeLabel(cls) : '-'}</td>
  </tr>`;
}

  priceAlerts.forEach((alert, i) => {
    const stock = allStocks.find(s => s.id === alert.id);

    const hit = alert.type === 'above' ? stock.price >= alert.targetPrice : stock.price <= alert.targetPrice;
    if (hit) {
      const sym = alert.market === 'kr' ? '₩' : '$';
      const notif = `${alert.name}: ${alert.type==='above'?'목표가 도달':'손절가 도달'} (${sym}${alert.targetPrice.toLocaleString()})`;
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('StockLens 알림', { body: notif });
      }
    }
  });
}
