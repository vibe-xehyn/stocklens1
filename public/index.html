      <div class="home-idx-val ${up?'up':'down'}">${m.value.toLocaleString(undefined,{maximumFractionDigits:2})}</div>
      <div class="home-idx-chg ${up?'up':'down'}">${up?'+':''}${m.change.toFixed(2)}%</div>
    </div>`;
  }).join('');

  const stockRowHTML = d => {
    const up = (d.changePct||0) >= 0;
    const isKrStock = d.market === 'kr';
    const sym = isKrStock ? '₩' : '$';
    const mainLabel = isKrStock ? d.name : d.displayTicker;
    const subLabel  = isKrStock ? d.displayTicker : d.name;
    const usdkrw = ratesCache?.usdkrw?.value;
    const krwHint = (!isKrStock && d.price && usdkrw)
      ? `<div style="font-size:10px;color:var(--muted)">≈ ₩${Math.round(d.price * usdkrw).toLocaleString()}</div>` : '';
    return `<div class="home-stock-row" onclick="selectStock('${d.id}')">
      <div class="home-stock-info">
        <div class="home-stock-ticker">${mainLabel}</div>
        <div class="home-stock-name">${subLabel}</div>
      </div>
      <div class="home-stock-price">
        <div class="home-stock-pval ${up?'up':'down'}">${sym}${(d.price||0).toLocaleString(undefined,{maximumFractionDigits:2})}</div>
        <div class="home-stock-pchg ${up?'up':'down'}">${up?'+':''}${(d.changePct||0).toFixed(2)}%</div>
        ${krwHint}
      </div>
    </div>`;
  };

  const stocksSection = (title, items) => `
    <div class="card">
      <div class="home-section-title">${title}</div>
      ${items.length ? items.map(stockRowHTML).join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 0">데이터 로딩 중...</div>'}
    </div>`;

  document.getElementById('mainContent').innerHTML = `
    <div class="home-wrap">
      <div class="home-hero">
        <h1>Stock<span>Lens</span></h1>
        <p>한국 · 미국 주식 실시간 분석 &amp; AI 투자 의견</p>
      </div>

      <div class="home-indices" style="margin-bottom:20px">${idxHTML || ''}</div>

      <!-- 투자신호 (메인 기능 - 최우선) -->
      <div id="buySignalsCard">${renderBuySignalsCard(null)}</div>

      <!-- 등락 상위/하락 -->
      <div class="home-stocks-grid" style="margin-bottom:24px">
        ${stocksSection('📈 상승 상위', gainers)}
        ${stocksSection('📉 하락 상위', losers)}
      </div>

      <!-- 한국 주식 -->
      <div class="home-section-title" style="margin-bottom:12px">한국 주식</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px">
        ${chunkArray(krAll, Math.ceil(krAll.length/3)).map(group =>
          `<div class="card" style="padding:12px 16px">${group.map(stockRowHTML).join('')}</div>`
        ).join('')}
      </div>

      <!-- 미국 주식 -->
      <div class="home-section-title" style="margin-bottom:12px">미국 주식</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px">
        ${chunkArray(usAll, Math.ceil(usAll.length/3)).map(group =>
          `<div class="card" style="padding:12px 16px">${group.map(stockRowHTML).join('')}</div>`
        ).join('')}
      </div>

      <!-- 매크로 대시보드 -->
      ${renderMacroDashboard(macro)}

      <!-- 포트폴리오 & 알림 -->
      <div class="home-stocks-grid" style="margin-bottom:24px">
        ${renderPortfolioCard(all)}
        ${renderAlertsCard(all)}
      </div>

      <!-- 가치투자 스크리너 -->
      ${renderScreenerCard(all)}
    </div>`;

  // 매수신호: 카드가 뷰포트에 진입할 때 로딩 (IntersectionObserver)
  const bsEl = document.getElementById('buySignalsCard');
  if (bsEl) {
    const obs = new IntersectionObserver((entries, o) => {
      if (entries[0].isIntersecting) { loadBuySignals(); o.disconnect(); }
    }, { rootMargin: '200px' });
    obs.observe(bsEl);
  }
}

function renderMacroDashboard(m) {
  if (!m || !Object.keys(m).length) return '';
  const item = (label, key, isRate=false, prefix='', suffix='') => {
    const d = m[key]; if (!d) return '';
    const up = d.change >= 0;
    const chgColor = isRate ? (up?'var(--red)':'var(--green)') : (up?'var(--green)':'var(--red)');
    return `<div style="background:var(--surface2);border-radius:8px;padding:10px 12px">
      <div style="font-size:10px;color:var(--muted);font-weight:700">${label}</div>
      <div style="font-weight:700;font-size:14px;margin-top:4px">${prefix}${d.value.toLocaleString(undefined,{maximumFractionDigits:2})}${suffix}</div>
      <div style="font-size:11px;color:${chgColor};margin-top:2px">${up?'▲':'▼'}${Math.abs(d.change).toFixed(2)}${isRate?'%p':'%'}</div>
    </div>`;
  };
  const vix = m.vix;
  const vixLevel = vix ? (vix.value < 15 ? {label:'극도 탐욕',color:'var(--green)'} : vix.value < 20 ? {label:'탐욕',color:'#86efac'} : vix.value < 30 ? {label:'중립',color:'var(--yellow)'} : vix.value < 40 ? {label:'공포',color:'var(--red)'} : {label:'극도 공포',color:'#ef4444'}) : null;

  return `<div class="card" style="margin-bottom:24px">
    <div class="home-section-title" style="margin-bottom:12px">글로벌 매크로 대시보드</div>
    ${vixLevel && vix ? `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;background:var(--surface2);border-radius:10px;padding:12px 16px">
      <div>
        <div style="font-size:10px;color:var(--muted);font-weight:700">VIX 공포/탐욕 지수</div>
        <div style="font-size:22px;font-weight:800;color:${vixLevel.color}">${vix.value}</div>
      </div>
      <div>
        <div style="font-size:14px;font-weight:700;color:${vixLevel.color}">${vixLevel.label}</div>
        <div style="font-size:11px;color:var(--muted)">전일대비 ${vix.change>0?'+':''}${vix.change.toFixed(2)}</div>
      </div>
      <div style="flex:1;background:var(--border);border-radius:4px;height:6px;margin-left:8px">
        <div style="width:${Math.min(100,vix.value/50*100)}%;background:${vixLevel.color};height:100%;border-radius:4px"></div>
      </div>
    </div>` : ''}
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">
      ${item('S&P 500','sp500',false,'','')}
      ${item('NASDAQ','nasdaq',false,'','')}
      ${item('DOW','dow',false,'','')}
      ${item('USD/KRW','usdkrw',false,'','원')}
      ${item('달러인덱스','dxy',false,'','')}
      ${item('미 10년물 금리','us10y',true,'','%')}
      ${item('EUR/USD','eurusd',false,'','')}
      ${item('금','gold',false,'$','')}
      ${item('WTI 원유','oil',false,'$','')}
      ${item('비트코인','btc',false,'$','')}
    </div>
  </div>`;
}

function renderPortfolioCard(allStocks) {
  const sym = d => d.market === 'kr' ? '₩' : '$';
  const usdkrw = ratesCache?.usdkrw?.value || 1300;

  const rows = portfolio.map((p, i) => {
    const stock = allStocks.find(s => s.id === p.id);
    const curPrice = stock?.price || 0;
    const pnl = (curPrice - p.buyPrice) * p.qty;
    const pnlPct = p.buyPrice > 0 ? (curPrice - p.buyPrice) / p.buyPrice * 100 : 0;
    const up = pnlPct >= 0;
    const pnlKrw = p.market === 'us' ? pnl * usdkrw : pnl;
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:700;font-size:13px">${p.ticker} <span style="color:var(--muted);font-weight:400;font-size:11px">${p.qty}주 @ ${sym(p)}${p.buyPrice.toLocaleString()}</span></div>
        <div style="font-size:11px;color:var(--muted)">${p.name}</div>
      </div>
      <div style="text-align:right">
        <div style="font-weight:700;color:${up?'var(--green)':'var(--red)'}">${up?'+':''}${pnl.toLocaleString(undefined,{maximumFractionDigits:0})} (${pnlPct.toFixed(1)}%)</div>
        ${p.market==='us' ? `<div style="font-size:10px;color:var(--muted)">≈ ₩${pnlKrw.toLocaleString(undefined,{maximumFractionDigits:0})}</div>` : ''}
        <button onclick="removeFromPortfolio(${i})" style="font-size:10px;color:var(--red);background:none;border:none;cursor:pointer;padding:0">삭제</button>
      </div>
    </div>`;
  });

  const totalKrw = portfolio.reduce((sum, p) => {
    const stock = allStocks.find(s => s.id === p.id);
    const curPrice = stock?.price || 0;
    const pnl = (curPrice - p.buyPrice) * p.qty;
    return sum + (p.market === 'us' ? pnl * usdkrw : pnl);
  }, 0);

  return `<div class="card">
    <div class="home-section-title" style="margin-bottom:12px">포트폴리오</div>
    ${portfolio.length ? `
      <div style="background:var(--surface2);border-radius:8px;padding:10px 14px;margin-bottom:12px">
        <div style="font-size:11px;color:var(--muted)">총 손익 (원화 환산)</div>
        <div style="font-size:20px;font-weight:800;color:${totalKrw>=0?'var(--green)':'var(--red)'}">₩${totalKrw.toLocaleString(undefined,{maximumFractionDigits:0})}</div>
      </div>
      ${rows.join('')}
    ` : '<div style="color:var(--muted);font-size:13px;padding:8px 0">종목 상세에서 포트폴리오에 추가하세요</div>'}
    <button onclick="showPortfolioAdd()" style="margin-top:12px;width:100%;padding:8px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer">+ 수동 추가</button>
  </div>`;
}

function renderAlertsCard(allStocks) {
  const sym = d => d.market === 'kr' ? '₩' : '$';
  const rows = priceAlerts.map((a, i) => {
    const stock = allStocks.find(s => s.id === a.id);
    const cur = stock?.price;
    const hit = cur && (a.type==='above' ? cur >= a.targetPrice : cur <= a.targetPrice);
    return `<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-weight:700;font-size:13px">${a.ticker} <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:${a.type==='above'?'rgba(34,197,94,0.15)':'rgba(239,68,68,0.15)'};color:${a.type==='above'?'var(--green)':'var(--red)'}">${a.type==='above'?'목표가':'손절가'}</span></div>
        <div style="font-size:11px;color:var(--muted)">${sym(a)}${a.targetPrice.toLocaleString()} | 현재 ${cur ? sym(a)+cur.toLocaleString(undefined,{maximumFractionDigits:2}) : '로딩'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${hit ? '<span style="font-size:11px;color:var(--green);font-weight:700">달성!</span>' : ''}
        <button onclick="removeAlert(${i})" style="font-size:10px;color:var(--red);background:none;border:none;cursor:pointer">삭제</button>
      </div>
    </div>`;
  });

  return `<div class="card">
    <div class="home-section-title" style="margin-bottom:12px">가격 알림</div>
    ${priceAlerts.length ? rows.join('') : '<div style="color:var(--muted);font-size:13px;padding:8px 0">종목 상세에서 알림을 설정하세요</div>'}
    <button onclick="requestNotificationPermission()" style="margin-top:12px;width:100%;padding:8px;border-radius:6px;border:1px dashed var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer">브라우저 알림 허용</button>
  </div>`;
}

// 매수신호 상태
let _buySignalMarket = 'all'; // all | kr | us
let _buySignalTab = '전체';   // 전체 | 강력매수 | 매수 | 약매수
let _buySignalMode = 'buy';   // buy | sell
let _buySignalsCache = {};    // mode_market -> data (빠른 탭 전환용)
let _loadingBuySignals = false;

const SIG_STYLE = {
  '강력매수': { border:'rgba(22,163,74,0.5)',  bg:'rgba(22,163,74,0.08)',  color:'#16a34a', icon:'▲▲' },
  '매수':     { border:'rgba(34,197,94,0.3)',  bg:'rgba(34,197,94,0.05)',  color:'#22c55e', icon:'▲' },
  '약매수':   { border:'rgba(134,239,172,0.3)',bg:'rgba(134,239,172,0.04)',color:'#86efac', icon:'△' },
  '강력매도': { border:'rgba(220,38,38,0.5)',  bg:'rgba(220,38,38,0.08)',  color:'#dc2626', icon:'▼▼' },
  '매도':     { border:'rgba(239,68,68,0.3)',  bg:'rgba(239,68,68,0.05)',  color:'#ef4444', icon:'▼' },
  '약매도':   { border:'rgba(252,165,165,0.3)',bg:'rgba(252,165,165,0.04)',color:'#fca5a5', icon:'▽' },
};

function renderBuySignalsCard(data) {
  const loading = !data;
  const updatedAt = data?.updatedAt ? new Date(data.updatedAt).toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'}) : '';
  const allBuys = data?.buys || [];
  const serverCounts = data?.counts || {};
  const isSell = _buySignalMode === 'sell';

  const modeToggle = '';  // 헤더에 통합됨

  // 마켓 탭 (우측 세그먼트)
  const MARKET_TABS = [
    { key:'all', label:'전체', count: serverCounts.all ?? allBuys.length },
    { key:'kr',  label:'한국', count: serverCounts.kr ?? allBuys.filter(d=>d.market==='kr').length },
    { key:'us',  label:'미국', count: serverCounts.us ?? allBuys.filter(d=>d.market==='us').length },
  ];
  const marketBar = `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px">
    <div style="font-size:11px;color:var(--muted)">
      ${MARKET_TABS.find(m=>m.key===_buySignalMarket)?.count ?? 0}개 종목
    </div>
    <div style="display:flex;gap:2px;background:var(--surface2);border-radius:6px;padding:2px">
      ${MARKET_TABS.map(m => {
        const active = m.key === _buySignalMarket;
        return `<button onclick="switchBuyMarket('${m.key}')" style="padding:3px 10px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;border:none;transition:all 0.15s;background:${active?'var(--accent2)':'transparent'};color:${active?'#fff':'var(--muted)'}">${m.label}</button>`;
      }).join('')}
    </div>
  </div>`;

  // 신호 탭
  const SIG_TABS = isSell ? ['전체', '강력매도', '매도', '약매도'] : ['전체', '강력매수', '매수', '약매수'];
  // serverCounts에 신호별 실제 전체 수가 있음 (50개 제한 전)
  const sigCounts = {};
  SIG_TABS.slice(1).forEach(t => { sigCounts[t] = serverCounts[t] ?? allBuys.filter(d => d.signal === t).length; });
  sigCounts['전체'] = SIG_TABS.slice(1).reduce((s, t) => s + (sigCounts[t] || 0), 0);
  const sigBar = `<div style="display:flex;gap:3px;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;margin-bottom:14px">
    ${SIG_TABS.map(t => {
      const active = t === _buySignalTab;
      const ss = SIG_STYLE[t];
      return `<button onclick="switchBuyTab('${t}')" style="flex:1;padding:5px 4px;font-size:11px;font-weight:700;border-radius:4px;cursor:pointer;border:none;transition:all 0.15s;background:${active?(ss?ss.bg:'var(--accent2)'):'transparent'};color:${active?(ss?ss.color:'#fff'):'var(--muted)'};${active&&ss?'border:1px solid '+ss.border:'border:1px solid transparent'}">
        ${t} <span style="font-size:10px;opacity:0.8">${sigCounts[t]||0}</span>
      </button>`;
    }).join('')}
  </div>`;

  const filtered = _buySignalTab === '전체' ? allBuys : allBuys.filter(d => d.signal === _buySignalTab);

  const scoreBarHtml = (score, ss) => {
    const abs = Math.abs(score);
    const pct = Math.min(100, abs / 1.6);
    const label = score > 0 ? `+${score}` : `${score}`;
    return `<div style="display:flex;align-items:center;gap:4px">
      <div style="width:48px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden"><div style="height:100%;width:${pct}%;background:${ss.color};border-radius:2px"></div></div>
      <span style="font-size:10px;color:${ss.color};font-weight:700;min-width:28px">${label}</span>
    </div>`;
  };

  const rows = filtered.map((d, i) => {
    const up = (d.changePct || 0) >= 0;
    const isUs = d.market === 'us';
    const sym = isUs ? '$' : '₩';
    const fallbackStyle = isSell ? SIG_STYLE['약매도'] : SIG_STYLE['약매수'];
    const ss = SIG_STYLE[d.signal] || fallbackStyle;
    const def = STOCK_DEFS.find(s => s.id === d.ticker) || {};
    const displayName = d.name || def.name || d.ticker;
    const displayTicker = def.displayTicker || d.ticker;
    const krwLine = isUs && d.price && ratesCache?.usdkrw?.value
      ? `<div style="font-size:10px;color:var(--muted)">≈ ₩${Math.round(d.price * ratesCache.usdkrw.value).toLocaleString()}</div>` : '';
    return `<div onclick="selectStock('${d.ticker}')" style="display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;cursor:pointer;transition:background 0.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
      <span style="font-size:11px;color:var(--muted);width:18px;text-align:right;flex-shrink:0">${i+1}</span>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:1px">
          <span style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${displayName}</span>
          <span style="font-size:10px;font-weight:800;color:${ss.color};background:${ss.bg};border:1px solid ${ss.border};padding:1px 6px;border-radius:10px;white-space:nowrap;flex-shrink:0">${d.signal}</span>
        </div>
        <div style="font-size:10px;color:var(--muted)">${displayTicker}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:700;font-size:13px">${sym}${(d.price||0).toLocaleString(undefined,{maximumFractionDigits:isUs?2:0})}</div>
        <div style="font-size:11px;color:${up?'var(--green)':'var(--red)'}">${up?'+':''}${(d.changePct||0).toFixed(2)}%</div>
        ${krwLine}
      </div>
      <div style="flex-shrink:0;text-align:right;min-width:52px">
        ${scoreBarHtml(d.score||0, ss)}
        <div style="font-size:9px;color:var(--muted);margin-top:2px">${d.score>0?'+':''}${d.score||0}점</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="card" style="margin-bottom:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px">
      <div>
        <div class="home-section-title" style="margin-bottom:0">투자 신호 <span style="font-size:10px;color:var(--muted);font-weight:400">시가총액 상위 2000개</span></div>
        ${updatedAt ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">${updatedAt} 기준</div>` : ''}
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <div style="display:flex;gap:2px;background:var(--surface2);border-radius:6px;padding:2px">
          <button onclick="switchBuyMode('buy')" style="padding:4px 12px;font-size:11px;font-weight:700;border-radius:5px;cursor:pointer;border:none;transition:all 0.15s;background:${!isSell?'rgba(22,163,74,0.2)':'transparent'};color:${!isSell?'#16a34a':'var(--muted)'}">매수</button>
          <button onclick="switchBuyMode('sell')" style="padding:4px 12px;font-size:11px;font-weight:700;border-radius:5px;cursor:pointer;border:none;transition:all 0.15s;background:${isSell?'rgba(220,38,38,0.2)':'transparent'};color:${isSell?'#ef4444':'var(--muted)'}">매도</button>
        </div>
        <button onclick="loadBuySignals(true)" style="font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer" title="새로고침">↻</button>
      </div>
    </div>
    ${loading
      ? `<div style="color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px"><span class="spinner" style="width:14px;height:14px;border-width:2px"></span> 신호 데이터 로딩 중...</div>`
      : `${marketBar}${sigBar}${filtered.length
          ? `<div style="max-height:480px;overflow-y:auto;padding-right:4px">${rows}</div>`
          : `<div style="color:var(--muted);font-size:13px;padding:20px;text-align:center">해당하는 종목이 없습니다</div>`}`
    }
  </div>`;
}

function _cacheKey() { return `${_buySignalMode}_${_buySignalMarket}`; }

function _reRenderBuySignals() {
  const el = document.getElementById('buySignalsCard');
  const data = _buySignalsCache[_cacheKey()];
  if (el) el.innerHTML = renderBuySignalsCard(data || null);
}

async function switchBuyMode(mode) {
  _buySignalMode = mode;
  _buySignalTab = '전체';
  const el = document.getElementById('buySignalsCard');
  const key = _cacheKey();
  if (_buySignalsCache[key]) {
    _reRenderBuySignals();
  } else {
    if (el) el.innerHTML = renderBuySignalsCard(null);
    await _fetchBuySignals(_buySignalMarket);
  }
}

async function switchBuyMarket(market) {
  _buySignalMarket = market;
  _buySignalTab = '전체';
  const el = document.getElementById('buySignalsCard');
  const key = _cacheKey();
  if (_buySignalsCache[key]) {
    _reRenderBuySignals();
  } else {
    if (el) el.innerHTML = renderBuySignalsCard(null);
    await _fetchBuySignals(market);
  }
}

function switchBuyTab(tab) {
  _buySignalTab = tab;
  _reRenderBuySignals();
}

async function _fetchBuySignals(market) {
  const el = document.getElementById('buySignalsCard');
  const key = `${_buySignalMode}_${market}`;
  try {
    const url = `/api/buy-signals?market=${market}&mode=${_buySignalMode}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.buys) {
      _buySignalsCache[key] = data;
      if (_cacheKey() === key && el) el.innerHTML = renderBuySignalsCard(data);
    }
  } catch {}
}

async function loadBuySignals(force = false) {
  if (_loadingBuySignals && !force) return;
  _loadingBuySignals = true;
  if (force) _buySignalsCache = {};
  const el = document.getElementById('buySignalsCard');
  if (!el) { _loadingBuySignals = false; return; }
  el.innerHTML = renderBuySignalsCard(null);

  for (let attempt = 0; attempt < 4; attempt++) {
    try {
      const params = new URLSearchParams({ market: _buySignalMarket, mode: _buySignalMode });
      const res = await fetch(`/api/buy-signals?${params}`);
      const data = await res.json();
      if (data.buys) {
        _buySignalsCache[_cacheKey()] = data;
        if (el) el.innerHTML = renderBuySignalsCard(data);
        // 다른 마켓도 백그라운드 프리페치
        for (const m of ['all','kr','us']) {
          const mk = `${_buySignalMode}_${m}`;
          if (mk !== _cacheKey() && !_buySignalsCache[mk]) {
            fetch(`/api/buy-signals?market=${m}&mode=${_buySignalMode}`).then(r=>r.json()).then(d=>{ if(d.buys) _buySignalsCache[mk]=d; }).catch(()=>{});
          }
        }
        _loadingBuySignals = false;
        return;
      }
    } catch {}
    if (attempt < 3) await new Promise(r => setTimeout(r, 10000));
  }
  if (el) el.innerHTML = `<div class="card" style="margin-bottom:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <div class="home-section-title">투자신호</div>
      <button onclick="loadBuySignals(true)" style="font-size:11px;padding:4px 10px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer">재시도</button>
    </div>
    <div style="color:var(--muted);font-size:13px">데이터 준비 중입니다. 잠시 후 재시도를 클릭하세요.</div>
  </div>`;
  _loadingBuySignals = false;
}

function renderScreenerCard(allStocks) {
  // 가치투자 기준으로 자동 필터
  const criteria = [
    { label: 'PER < 15 (저평가)', fn: d => d.per && d.per < 15 },
    { label: 'ROE > 15% (수익성)', fn: d => d.roe && d.roe > 15 },
    { label: '배당 > 2% (배당주)', fn: d => d.div && d.div > 2 },
    { label: '성장주 (매출성장 > 20%)', fn: d => d.revenueGrowth && d.revenueGrowth > 20 },
    { label: 'PBR < 1 (자산가치)', fn: d => d.pbr && d.pbr < 1 },
  ];

  const quoteAll = allStocks.map(s => ({ ...s, ...(quoteCache[s.id] || {}) }));

  return `<div class="card" style="margin-bottom:24px">
    <div class="home-section-title" style="margin-bottom:12px">가치투자 스크리너</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px">
      ${criteria.map((c,i) => `<button onclick="applyScreener(${i})" id="screenerBtn${i}"
        style="padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;cursor:pointer;transition:all 0.2s"
        onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'"
        onmouseout="if(!this.classList.contains('active')){this.style.borderColor='var(--border)';this.style.color='var(--muted)'}">
        ${c.label}
      </button>`).join('')}
    </div>
    <div id="screenerResults" style="font-size:13px;color:var(--muted)">필터를 선택하면 조건에 맞는 종목이 표시됩니다</div>
  </div>`;
}

const _screenerCriteria = [
  { fn: d => d.per && d.per < 15 },
  { fn: d => d.roe && d.roe > 15 },
  { fn: d => d.div && d.div > 2 },
  { fn: d => d.revenueGrowth && d.revenueGrowth > 20 },
  { fn: d => d.pbr && d.pbr < 1 },
];

let _screenerDataCache = null;

async function _getScreenerData() {
  if (_screenerDataCache) return _screenerDataCache;
  const res = await fetch('/api/screener-data');
  _screenerDataCache = await res.json();
  return _screenerDataCache;
}

// 홈 로드 시 백그라운드 프리페치
setTimeout(() => _getScreenerData().catch(() => {}), 3000);

async function applyScreener(idx) {
  document.querySelectorAll('[id^=screenerBtn]').forEach(b => {
    b.classList.remove('active'); b.style.borderColor='var(--border)'; b.style.color='var(--muted)'; b.style.background='transparent';
  });
  const btn = document.getElementById(`screenerBtn${idx}`);
  if (btn) { btn.classList.add('active'); btn.style.borderColor='var(--accent)'; btn.style.color='var(--accent)'; btn.style.background='rgba(59,130,246,0.1)'; }

  const el = document.getElementById('screenerResults');
  if (!el) return;
  if (!_screenerDataCache) el.innerHTML = '<div style="color:var(--muted)">데이터 로딩 중...</div>';

  let data;
  try {
    data = await _getScreenerData();
  } catch(e) {
    el.innerHTML = '<div style="color:var(--red)">데이터 로딩 실패</div>';
    return;
  }

  const criterion = _screenerCriteria[idx];
  const matched = Object.entries(data).filter(([, d]) => {
    try { return criterion.fn(d); } catch { return false; }
  }).map(([ticker, d]) => {
    const def = STOCK_DEFS.find(s => s.id === ticker || s.ticker === ticker) || {};
    return { ...def, ...d, id: def.id || ticker };
  });

  if (!matched.length) { el.innerHTML = '<div style="color:var(--muted)">조건에 맞는 종목 없음</div>'; return; }

  const fmtSafe = (v, decimals=1, min=-9999, max=9999) =>
    (typeof v === 'number' && isFinite(v) && v > min && v < max) ? v.toFixed(decimals) : null;

  el.innerHTML = `<div>${matched.map(d => {
    const up = (d.changePct||0) >= 0;
    const isUs = d.market === 'us';
    const sym = isUs ? '$' : '₩';
    // STOCK_DEFS에서 정확한 이름 우선 사용
    const def = STOCK_DEFS.find(s => s.ticker === d.ticker || s.id === d.id) || {};
    const displayName = def.name || d.name || d.ticker;
    const displayTicker = def.displayTicker || d.ticker || d.id;
    const isKrStock = d.market === 'kr' || /^[0-9]{6}$/.test(displayTicker);
    const mainLabel = isKrStock ? displayName : displayTicker;
    const subLabel = isKrStock ? displayTicker : displayName;
    const usdkrw = ratesCache?.usdkrw?.value;
    const krwHint = (!isKrStock && d.price && usdkrw)
      ? `<span style="font-size:10px;color:var(--muted)"> ≈ ₩${Math.round(d.price*usdkrw).toLocaleString()}</span>` : '';
    // 이상값 필터 (PER>500, PBR<0, ROE<-100 등 제외)
    const per = fmtSafe(d.per, 1, 0, 500);
    const pbr = fmtSafe(d.pbr, 2, 0, 200);
    const roe = fmtSafe(d.roe, 1, -100, 200);
    const div = fmtSafe(d.div, 1, 0, 50);
    const metaParts = [
      per ? `PER ${per}` : '',
      pbr ? `PBR ${pbr}` : '',
      roe ? `ROE ${roe}%` : '',
      div ? `배당 ${div}%` : '',
    ].filter(Boolean).join(' · ');
    return `<div onclick="selectStock('${d.id || d.ticker}')" style="display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-radius:8px;cursor:pointer;transition:background 0.15s" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='transparent'">
      <div style="min-width:0;flex:1;margin-right:12px">
        <div style="font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${mainLabel}</div>
        <div style="font-size:10px;color:var(--muted)">${subLabel}${metaParts ? ' · '+metaParts : ''}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-weight:700;color:${up?'var(--green)':'var(--red)'}">${sym}${(d.price||0).toLocaleString(undefined,{maximumFractionDigits:isUs?2:0})}</div>
        <div style="font-size:11px;color:${up?'var(--green)':'var(--red)'}">${up?'+':''}${(d.changePct||0).toFixed(2)}%${krwHint}</div>
      </div>
    </div>`;
  }).join('')}</div>`;
}

function showAddToPortfolio(defOverride) {
  _portfolioDef = defOverride || currentDef;
  const q = quoteCache[_portfolioDef.id] || {};
  const sym = _portfolioDef.market === 'kr' ? '₩' : '$';
  const isKr = _portfolioDef.market === 'kr';
  document.getElementById('portfolioModalSub').textContent = _portfolioDef.name + ' 매수 정보 입력';
  const priceEl = document.getElementById('portfolioPrice');
  priceEl.value = q.price ? (isKr ? Math.round(q.price) : q.price.toFixed(2)) : '';
  document.getElementById('portfolioQty').value = '';
  document.getElementById('portfolioCurPrice').innerHTML = q.price
    ? `현재가 <strong>${sym}${q.price.toLocaleString(undefined,{maximumFractionDigits:isKr?0:2})}</strong>` : '';
  document.getElementById('portfolioPreview').style.display = 'none';
  document.getElementById('portfolioModal').classList.add('open');
  setTimeout(() => priceEl.focus(), 100);
}

function updatePortfolioPreview() {
  const price = parseFloat(document.getElementById('portfolioPrice').value);
  const qty = parseFloat(document.getElementById('portfolioQty').value);
  const preview = document.getElementById('portfolioPreview');
  if (!isNaN(price) && !isNaN(qty) && price > 0 && qty > 0) {
    const sym = (_portfolioDef?.market === 'kr') ? '₩' : '$';
    const total = price * qty;
    preview.style.display = 'block';
    document.getElementById('portfolioTotalVal').textContent =
      sym + total.toLocaleString(undefined, { maximumFractionDigits: _portfolioDef?.market === 'kr' ? 0 : 2 });
  } else {
    preview.style.display = 'none';
  }
}

function confirmPortfolioAdd() {
  const price = parseFloat(document.getElementById('portfolioPrice').value);
  const qty = parseFloat(document.getElementById('portfolioQty').value);
  if (isNaN(price) || price <= 0) {
    document.getElementById('portfolioPrice').focus();
    document.getElementById('portfolioPrice').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('portfolioPrice').style.borderColor = '', 1500);
    return;
  }
  if (isNaN(qty) || qty <= 0) {
    document.getElementById('portfolioQty').focus();
    document.getElementById('portfolioQty').style.borderColor = 'var(--red)';
    setTimeout(() => document.getElementById('portfolioQty').style.borderColor = '', 1500);
    return;
  }
  addToPortfolio(_portfolioDef, price, qty);
  closePortfolioModal();
  // 홈이면 재렌더
  if (isHomePage) renderHome({ skipFetch: true });
}

async function selectStock(id, fromPopState = false) {
  isHomePage = false;
  // STOCK_DEFS에 없으면 ticker 기반으로 임시 def 생성 (스크리너/매수신호 종목)
  let def = STOCK_DEF(id);
  if (!def) {
    const isKr = /^[0-9]{6}$/.test(id);
    def = { id, ticker: id, displayTicker: id, name: id, market: isKr ? 'kr' : 'us', exchange: isKr ? 'KOSPI' : 'NASDAQ' };
  }
  currentDef = def;
  currentRange = '1mo';
  if (!fromPopState) {
    const cur = history.state;
    if (!cur || cur.page !== 'stock' || cur.id !== id) {
      history.pushState({ page: 'stock', id }, '', `/?stock=${encodeURIComponent(id)}`);
    }
  }
  renderSidebar(document.getElementById('searchInput').value);
  await loadAndRenderMain(currentDef);
}

let _mobileTab = 'home';
let _mobileMarket = 'kr';

function mobileTab(tab) {
  _mobileTab = tab;
  document.getElementById('mobileDrawer').classList.remove('open');
  document.getElementById('mobileSearchDrawer').classList.remove('open');

function mobileMarketSwitch(market) {
  _mobileMarket = market;
  ['kr','us','all'].forEach(m => {
    const el = document.getElementById('mdTab' + m.charAt(0).toUpperCase() + m.slice(1));
    if (el) el.classList.toggle('active', m === market);
  });
  renderMobileStockList();
}

function renderMobileStockList() {
  const el = document.getElementById('mobileStockList');
  if (!el) return;
  const all = STOCK_DEFS.filter(s => _mobileMarket === 'all' || s.market === _mobileMarket)
    .map(s => ({ ...s, ...(sidebarCache[s.id] || {}) }));
  const list = all;
  if (!list.length) { el.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">로딩 중...</div>'; return; }
  el.innerHTML = list.map(s => {
    const chg = s.changePct ?? 0;
    const color = chg > 0 ? 'var(--green)' : chg < 0 ? 'var(--red)' : 'var(--muted)';
    const sign = chg > 0 ? '+' : '';
    const price = s.market === 'kr' ? `₩${(s.price||0).toLocaleString()}` : `$${(s.price||0).toFixed(2)}`;
    return `<div class="stock-item" onclick="mobileSelectStock('${s.id||s.ticker}')">
      <div class="stock-left"><div class="ticker">${s.displayTicker||s.ticker}</div><div class="sname">${s.name}</div></div>
      <div class="stock-right"><div class="stock-price">${price}</div><div class="stock-chg" style="color:${color}">${sign}${chg.toFixed(2)}%</div></div>
    </div>`;
  }).join('');
}

function mobileSelectStock(id) {
  document.getElementById('mobileDrawer').classList.remove('open');
  document.getElementById('bnavHome').classList.add('active');
  document.getElementById('bnavStocks').classList.remove('active');
  document.getElementById('bnavSearch').classList.remove('active');

}

let _mobileSearchTimer = null;
function onMobileSearch(val) {
  const res = document.getElementById('mobileSearchResults');
  if (!val.trim()) { res.innerHTML = ''; return; }
  clearTimeout(_mobileSearchTimer);
  res.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center;font-size:13px">검색 중...</div>';
  _mobileSearchTimer = setTimeout(() => doMobileSearch(val.trim()), 300);
}

async function doMobileSearch(q) {
  const res = document.getElementById('mobileSearchResults');
  try {
    const results = await api(`/api/search?q=${encodeURIComponent(q)}&market=all`);
    if (!results.length) {
      res.innerHTML = '<div style="padding:20px;color:var(--muted);text-align:center">검색 결과 없음</div>';
      return;
    }
    res.innerHTML = results.map(r => {
      const cached = sidebarCache[r.ticker] || {};
      const sym = r.market === 'kr' ? '₩' : '$';
      const price = cached.price ? `${sym}${cached.price.toLocaleString(undefined,{maximumFractionDigits:2})}` : '';
      const chg = cached.changePct != null ? `${cached.changePct>=0?'+':''}${cached.changePct.toFixed(2)}%` : '';
      const mktLabel = r.market === 'kr' ? 'KR' : 'US';
      return `<div class="stock-item" onclick="mobileSearchSelectResult(${JSON.stringify(r).replace(/"/g,'&quot;')})">
        <div class="stock-left">
          <div class="ticker">${r.ticker} <span class="result-type" style="font-size:9px;padding:1px 5px;border-radius:3px;background:var(--surface2);color:var(--muted)">${mktLabel}</span></div>
          <div class="sname">${r.name}</div>
        </div>
        <div class="stock-right">${price ? `<div class="stock-price ${(cached.changePct||0)>=0?'up':'down'}">${price}</div><div class="stock-chg ${(cached.changePct||0)>=0?'up':'down'}">${chg}</div>` : ''}</div>
      </div>`;
    }).join('');
  } catch(e) {
    res.innerHTML = `<div style="padding:20px;color:var(--red);font-size:13px">오류: ${e.message}</div>`;
  }
}

function mobileSearchSelectResult(r) {
  let def = STOCK_DEFS.find(s => s.ticker === r.ticker);
  if (!def) {
    def = { id: r.ticker, market: r.market, exchange: r.exchange || (r.market==='kr'?'KOSPI':'NASDAQ'), ticker: r.ticker, displayTicker: r.ticker, name: r.name };
    STOCK_DEFS.push(def);
  }
  document.getElementById('mobileSearchDrawer').classList.remove('open');
  document.getElementById('mobileSearchInput').value = '';
  document.getElementById('mobileSearchResults').innerHTML = '';
  document.getElementById('bnavHome').classList.add('active');
  document.getElementById('bnavSearch').classList.remove('active');
  _mobileTab = 'home';
  selectStock(def.id);
}


// ESC 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePortfolioModal();
    closeAlertModal();
    closeMobileSearch();

  if (e.key === 'Enter') {
    if (document.getElementById('portfolioModal').classList.contains('open')) confirmPortfolioAdd();

function closeMobileSearch() {
  document.getElementById('mobileSearchDrawer').classList.remove('open');
  document.getElementById('mobileSearchInput').value = '';
  document.getElementById('mobileSearchResults').innerHTML = '';
  document.getElementById('bnavSearch').classList.remove('active');
  document.getElementById('bnavHome').classList.add('active');
  _mobileTab = 'home';
}

  <div class="modal-box">
    <div class="modal-title">포트폴리오 추가</div>
    <div class="modal-sub" id="portfolioModalSub">종목 매수 정보를 입력하세요</div>
    <div class="modal-field">
      <div class="modal-label">매수가</div>
      <input class="modal-input" id="portfolioPrice" type="number" placeholder="0" step="any" oninput="updatePortfolioPreview()">
      <div class="modal-price-tag" id="portfolioCurPrice"></div>
    </div>
    <div class="modal-field">
      <div class="modal-label">수량 (주)</div>
      <input class="modal-input" id="portfolioQty" type="number" placeholder="0" step="any" oninput="updatePortfolioPreview()">
    </div>
    <div id="portfolioPreview" style="background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:13px;display:none">
      <div style="display:flex;justify-content:space-between">
        <span style="color:var(--muted)">총 매수금액</span>
        <span id="portfolioTotalVal" style="font-weight:700"></span>
      </div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closePortfolioModal()">취소</button>
      <button class="modal-btn-primary" onclick="confirmPortfolioAdd()">추가</button>
    </div>
  </div>
</div>

<!-- ── 알림 설정 모달 ── -->
<div class="modal-overlay" id="alertModal" onclick="if(event.target===this)closeAlertModal()">
  <div class="modal-box">
    <div class="modal-title">가격 알림 설정</div>
    <div class="modal-sub" id="alertModalSub">목표가 또는 손절가 알림을 설정하세요</div>
    <div class="modal-field">
      <div class="modal-label">알림 유형</div>
      <div class="modal-segment">
        <button class="modal-seg-btn active-buy" id="alertTypeAbove" onclick="setAlertType('above')">📈 목표가 도달</button>
        <button class="modal-seg-btn" id="alertTypeBelow" onclick="setAlertType('below')">📉 손절가 도달</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:4px" id="alertTypeHint">현재가 이상이 되면 알림</div>
    </div>
    <div class="modal-field">
      <div class="modal-label">목표가격</div>
      <input class="modal-input" id="alertPrice" type="number" placeholder="0" step="any">
      <div class="modal-price-tag" id="alertCurPrice"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn-cancel" onclick="closeAlertModal()">취소</button>
      <button class="modal-btn-primary" onclick="confirmAlertAdd()">설정</button>
    </div>
  </div>
</div>

</body>
</html>
